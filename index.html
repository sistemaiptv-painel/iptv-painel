async function downloadBackup() {
  // Migra primeiro os anexos antigos do navegador para que o arquivo seja realmente completo.
  await migrateLegacySaleAttachments();
  // O banco inteiro é copiado sem selecionar campos manualmente. Assim, novas
  // propriedades (como referrals/indicações e bônus) também entram no backup.
  const backup = JSON.parse(JSON.stringify(state.db));
  backup.backupVersion = 3;
  backup.backupCreatedAt = new Date().toISOString();
  backup.backupIncludes = Object.keys(state.db);
  backup.backupComplete = true;
  const payload = JSON.stringify(backup, null, 2);
  const blob = new Blob([payload], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `backup-completo-iptv-manager-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(`Backup completo gerado: ${state.db.attachments?.length || 0} anexo(s) incluído(s).`);
}
function dataUrlToBlob(dataUrl) {
  const text = String(dataUrl || "");
  const match = text.match(/^data:([^;,]+)?(;base64)?,(.*)$/s);
  if (!match) return null;
  const type = match[1] || "application/octet-stream";
  const raw = match[2] ? atob(match[3]) : decodeURIComponent(match[3]);
  const bytes = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return new Blob([bytes], { type });
}
async function restoreAttachmentsLocally() {
  for (const item of (state.db.attachments || [])) {
    if (!item.dataUrl) continue;
    try { const blob = dataUrlToBlob(item.dataUrl); if (blob) await saleAttachRequest("readwrite", { ...item, blob }); } catch (err) { console.warn("Anexo restaurado no banco, mas não no cache local:", err); }
  }
}
function normalizeRestoredDB(input) {
  // Aceita tanto o formato atual quanto backups encapsulados por versões antigas.
  const source = input?.backupData && typeof input.backupData === "object"
    ? input.backupData
    : input;
  const seed = seedDB();
  const db = { ...source };
  const arrayCollections = ["clients", "products", "sales", "purchases", "suppliers", "cash", "agenda", "attachments"];
  arrayCollections.forEach(key => {
    if (!Array.isArray(db[key])) db[key] = Array.isArray(seed[key]) ? JSON.parse(JSON.stringify(seed[key])) : [];
  });
  db.settings = {
    ...seed.settings,
    ...(db.settings || {}),
    statuses: Array.isArray(db.settings?.statuses) && db.settings.statuses.length
      ? db.settings.statuses
      : seed.settings.statuses,
    templates: { ...seed.settings.templates, ...((db.settings || {}).templates || {}) },
    docs: { ...seed.settings.docs, ...((db.settings || {}).docs || {}) }
  };
  // O spread final preserva campos adicionais do cliente, inclusive referrals.
  db.clients = db.clients.map(c => ({
    color: "#22d3ee", matricula: "", cpf: "", address: "", addressNumber: "",
    neighborhood: "", zipCode: "", city: "", reference: "", indicatedBy: "",
    listData: "", referrals: [], ...c,
    referrals: Array.isArray(c?.referrals) ? c.referrals : []
  }));
  const usadosBk = new Set();
  db.clients.forEach(c => {
    let cod = String(c.matricula || "").trim();
    while (!cod || usadosBk.has(cod)) cod = String(Math.floor(10000000 + Math.random() * 90000000));
    c.matricula = cod;
    usadosBk.add(cod);
  });
  delete db.backupVersion;
  delete db.backupCreatedAt;
  delete db.backupIncludes;
  delete db.backupComplete;
  delete db.backupData;
  return db;
}
function restoreBackup(event) {
  const file = event.target.files?.[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const raw = JSON.parse(reader.result);
      const required = ["clients", "products", "sales", "purchases", "suppliers", "cash"];
      const source = raw?.backupData && typeof raw.backupData === "object" ? raw.backupData : raw;
      if (!source || typeof source !== "object" || !required.every(k => Array.isArray(source[k]))) throw new Error("estrutura");
      const db = normalizeRestoredDB(raw);
      state.db = db;
      localRestorePending = true;
      await restoreAttachmentsLocally();
      saveDB(); render();
      // A restauração precisa ser confirmada pelo servidor, não apenas pelo navegador.
      const serverResponse = await fetch('/api/db', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        cache: 'no-store',
        body: JSON.stringify(state.db)
      });
      if (!serverResponse.ok) throw new Error(`servidor HTTP ${serverResponse.status}`);
      remoteSyncReady = true;
      remoteSyncPending = false;
      localRestorePending = false;
      toast(`Backup restaurado e salvo no servidor: ${state.db.attachments.length} anexo(s).`);
    } catch (err) { console.error(err); toast("Arquivo inválido ou backup incompleto.", "error"); }
    event.target.value = "";
  };
  reader.readAsText(file);
}

function removeSale(id) {
const sale = byId("sales", id);
if (!sale) return;
const isOrc = sale.status === "orcamento";
if (!confirm(isOrc ? "Excluir este orçamento?" : "Excluir venda? O estoque será devolvido e os lançamentos do Caixa serão removidos.")) return;
reserveOrderNumber(sale.orderNumber);
const parcelado = Array.isArray(sale.crediario) && sale.crediario.length > 0;
const deveReverterEstoque = !isOrc && sale.status !== "cancelado" && saleAffectsStock(sale);
// Reverte exatamente as baixas marcadas e também corrige pedidos antigos sem flags.
if (sale.stockApplied) reversePaidSaleStock(sale);
else if (sale.physicalStockApplied) reversePhysicalStockOnce(sale);
else if (sale.iptvStockApplied) reverseIptvImmediateStockOnce(sale);
else if (deveReverterEstoque) {
  if (parcelado) applyPhysicalSaleStock(sale, +1);
  else applySaleStock(sale, +1);
}
// Lista IPTV parcelada consome 1 unidade por parcela paga.
(sale.crediario || []).forEach((inst, idx) => {
  if (inst.stockDeducted) reverseIptvInstallmentStock(sale, idx);
  else if (deveReverterEstoque && inst.status === "pago" && isIptvStockItem((sale.items || []).find(isIptvStockItem))) {
    (sale.items || []).forEach(item => {
      if (!isIptvStockItem(item)) return;
      const product = byId("products", item.productId);
      if (product) product.stock = Number(product.stock || 0) + 1;
    });
  }
});
// Devolve o bônus somente se ele foi consumido por este pedido.
if (sale.bonusStock) {
  const bp = byId("products", sale.bonusStock.productId);
  if (bp) bp.stock = Number(bp.stock || 0) + Number(sale.bonusStock.qty || 0);
}
// Remove todos os lançamentos relacionados ao pedido, inclusive parcelas pendentes/pagas.
state.db.cash = (state.db.cash || []).filter(m => !(
  ((m.refType === "venda" || m.refType === "venda_pendente" || m.refType === "brinde" || m.refType === "bonus") && String(m.refId || "") === String(id)) ||
  ((m.refType === "crediario" || m.refType === "crediario_pendente") && String(m.refId || "").startsWith(`parcela:${id}:`))
));
state.db.sales = (state.db.sales || []).filter(s => String(s.id) !== String(id));
saveDB();
render();
toast("Pedido excluído. Estoque e Caixa foram revertidos.");
}
function removePurchase(id) {
const p = byId("purchases", id);
if (!p || !confirm("Excluir compra? Estoque será abatido e caixa vinculado removido.")) return;
const prod = byId("products", p.productId);
if (prod && statusDef(p.status).affectsStock) prod.stock = Number(prod.stock || 0) - Number(p.qty || 0); // devolve somente se a compra entrou no estoque
state.db.cash = state.db.cash.filter(m => !(
  (m.refType === "compra" && String(m.refId) === String(id)) ||
  ((m.refType === "compra_crediario" || m.refType === "compra_crediario_pendente") && String(m.refId || "").startsWith(`parcelaCompra:${id}:`))
));
state.db.purchases = state.db.purchases.filter(x => x.id !== id);
saveDB();
render();
toast("Compra excluída.");
}

function tryAutoFillReferralByName(value) {
const q = (value || "").trim().toLowerCase();
if (!q) return;
const matEl = document.getElementById("refMatricula");
if (!matEl) return;
const onlyClients = (state.db.clients || []).filter(c => c.type !== "revendedor");
const exact = onlyClients.find(c => (c.name || "").trim().toLowerCase() === q);
if (exact) {
matEl.value = exact.matricula || "";
return;
}
const partial = onlyClients.filter(c => (c.name || "").toLowerCase().includes(q));
if (partial.length === 1) {
const nameEl = document.getElementById("refName");
if (nameEl) nameEl.value = partial[0].name || "";
matEl.value = partial[0].matricula || "";
}
}

const mat = (c.matricula || "").toLowerCase();
const ph = (c.phone || "").toLowerCase();

}).slice(0, 8);

function runPrint(html, title) {
const section = ensurePrintSection();
section.innerHTML = html + PADRAO_COMPROVANTES_CSS;
const prevTitle = document.title;
const nomeArquivo = String(title || "Comprovante")
  .replace(/[\\/:*?"<>|]+/g, " - ")
  .replace(/\s+/g, " ")
  .trim();
document.title = nomeArquivo;
document.body.classList.add("printing");
// Abre a impressão diretamente durante o clique, evitando bloqueio do navegador.
const limparImpressao = () => {
  document.title = prevTitle;
  document.body.classList.remove("printing");
  section.innerHTML = "";
  window.removeEventListener("afterprint", limparImpressao);
};
window.addEventListener("afterprint", limparImpressao, { once: true });
	const imagens = [...section.querySelectorAll("img")];
	let impresso = false;
	const imprimir = () => {
	  if (impresso) return;
	  impresso = true;
	  window.print();
	};
	const imagensProntas = imagens.map(img => img.complete
	  ? Promise.resolve()
	  : new Promise(resolve => {
	      img.addEventListener("load", resolve, { once: true });
	      img.addEventListener("error", resolve, { once: true });
	    })
	);
	Promise.all(imagensProntas).then(() => setTimeout(imprimir, 80));
	setTimeout(imprimir, 1200);
	setTimeout(limparImpressao, 3000);
}

const sales = state.db.sales.filter(s => s.clientId === client.id && s.status !== "orcamento");
const total = sales.reduce((sum, s) => sum + Number(s.total || 0), 0);
const paid = sales.filter(s => s.status === "pago").reduce((sum, s) => sum + Number(s.total || 0), 0);
const pending = sales.filter(s => s.status === "pendente").reduce((sum, s) => sum + Number(s.total || 0), 0);
const credOpen = sales.filter(s => s.status === "crediario").reduce((sum, s) => sum + (s.crediario || []).filter(i => i.status !== "pago").reduce((b, i) => b + Number(i.amount || 0), 0), 0);
const bonusMonths = (client.referrals || []).length;
return { sales, total, paid, pending: pending + credOpen, bonusMonths };
}

function printClientComprovante(id) {
const client = byId("clients", id);
if (!client) return;
const fin = computeClientFinance(client);
const paidSales = fin.sales.filter(s => ["pago", "pendente", "crediario"].includes(s.status)).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
// Agrupa produtos (mesma data + mesmo produto + mesma forma = 1 linha)
const historicoItens = [];
paidSales.forEach(s => {
const items = s.items || [];
if (!items.length) {
historicoItens.push({
date: s.date || "",
produto: "Pedido",
qtd: 1,
meses: 0,
mostrarMeses: false,
barcode: s.barcode || "",
pagamento: s.method || "—",
status: s.status || "pendente",
valor: Number(s.total || 0)
});
return;
}
items.forEach(item => {
const product = byId("products", item.productId);
const productName = product ? product.name : "";
const nomeBruto = String(item.name || productName || "");
const nomeBase = nomeBruto
.replace(/\s*\(\d+\s*(mês|meses|mes)\)/i, "")
.trim();
const qty = Math.max(1, Number(item.qty || 1));
const tipo = item.type || (product ? product.type : "");
const periodDays = Number(item.periodDays || (product ? product.periodDays : 0));
const nomeMesesMatch = nomeBruto.match(/\((\d+)\s*(mês|meses|mes)\)/i);
const nomeMeses = nomeMesesMatch ? Number(nomeMesesMatch[1]) : 0;
const mostrarMeses = tipo === "iptv" || periodDays > 0 || /iptv|lista/i.test(nomeBruto);
const mesesBase = periodDays > 0 ? periodDays / 30 : (nomeMeses || 1);
const meses = mostrarMeses ? Math.max(1, Math.round(mesesBase * qty)) : 0;
const valorBruto = Number(item.price || 0) * qty;
const valor = items.length === 1
? Number(s.total !== undefined ? s.total : valorBruto)
: valorBruto;
const barcode = product && product.barcode ? String(product.barcode) : (s.barcode || "");
historicoItens.push({
date: s.date || "",
produto: nomeBase || "Item",
qtd: qty,
meses: meses,
mostrarMeses: mostrarMeses,
barcode: barcode,
pagamento: s.method || "—",
valor: valor
});
});
});
const gruposHistorico = new Map();
historicoItens.forEach(item => {
const chave = `${item.date}|${item.produto}|${item.pagamento}|${item.status}`.toLowerCase();
if (!gruposHistorico.has(chave)) {
gruposHistorico.set(chave, {
date: item.date,
produto: item.produto,
qtd: 0,
meses: 0,
mostrarMeses: false,
barcodes: new Set(),
pagamento: item.pagamento,
status: item.status,
valor: 0
});
}
const grupo = gruposHistorico.get(chave);
if (item.barcode) grupo.barcodes.add(item.barcode);
grupo.qtd += item.qtd;
grupo.meses += item.meses;
grupo.mostrarMeses = grupo.mostrarMeses || item.mostrarMeses;
grupo.valor += item.valor;
});
const parcelasDetalhadas = paidSales.flatMap(s => {
const parcelas = Array.isArray(s.crediario) ? s.crediario : [];
const nomeProduto = (s.items || []).map(i => i.name || byId("products", i.productId)?.name).filter(Boolean).join(", ") || "Pedido";
return parcelas.map((inst, idx) => ({
numero: inst.num || idx + 1,
total: parcelas.length,
vencimento: inst.dueDate || s.dueDate || s.date || "",
valor: Number(inst.amount || 0),
status: inst.status === "pago" ? "Pago" : "Pendente",
produto: nomeProduto,
pedido: s.orderNumber || s.id || "—"
}));
}).sort((a,b) => (a.vencimento || "").localeCompare(b.vencimento || ""));
const parcelasRows = parcelasDetalhadas.map(parcela => `

// Aplica/remove a marca de brinde em um item já existente
// (precoTabela = preço digitado, usado quando o item passa a ser brinde)
function applyGiftFlagToItem(it, checked, precoTabela = null) {
if (!it) return;
if (checked) {
if (it.giftPrice == null) it.giftPrice = Number(precoTabela != null ? precoTabela : (it.price || 0));
it.isGift = true;
it.price = 0;
} else if (it.isGift) {
it.isGift = false;
if (it.giftPrice != null) { it.price = Number(it.giftPrice || 0); delete it.giftPrice; }
}
}

});

function saveSaleEdit(event, id) {
event.preventDefault();
const sale = byId("sales", id);
if (!sale) return;
const form = event.target;
const data = Object.fromEntries(new FormData(form).entries());
const estoqueSnapshot = JSON.parse(JSON.stringify(sale));
const parcelasAntes = Array.isArray(sale.crediario) ? JSON.parse(JSON.stringify(sale.crediario)) : [];
const isOrcEdit = sale.status === "orcamento";
const estoqueAntes = !!sale.stockApplied;
const estoqueFisicoAntes = !!sale.physicalStockApplied;
// A forma de pagamento também governa a baixa de estoque durante a edição.
// A baixa não depende de o status textual ser “pago”: formas como
// “Aguardando Pagamento” podem baixar estoque sem lançar entrada no Caixa.
// Assim, trocar para uma forma sem “Baixa estoque” devolve os itens já baixados.
const estoqueAgora = sale.status !== "orcamento" && saleAffectsStock({...sale, method: data.method || sale.method});
const crediarioAgora = sale.status === "crediario";
// Quantidades originais (capturadas quando o modal foi aberto)
const qtdAntigas = (state.editSaleSnapshot && state.editSaleSnapshot.saleId === id) ? state.editSaleSnapshot.qty : {};
(sale.items || []).forEach((it, i) => {
const nEl = form.querySelector(`[data-edit-item-name="${i}"]`);
const qEl = form.querySelector(`[data-edit-item-qty="${i}"]`);
const pEl = form.querySelector(`[data-edit-item-price="${i}"]`);
const gEl = form.querySelector(`[data-edit-item-gift="${i}"]`);
if (nEl) it.name = nEl.value.trim() || it.name;
if (qEl) it.qty = Math.max(1, num(qEl.value));
const precoDigitado = (pEl && !pEl.disabled) ? Math.max(0, num(pEl.value)) : null;
if (precoDigitado != null && !isGiftItem(it)) it.price = precoDigitado;
// Brinde marcado/desmarcado neste item: cada um cumpre a sua regra
if (gEl) applyGiftFlagToItem(it, gEl.checked, precoDigitado);
});
// Reconcilia somente o que foi realmente baixado no pedido anterior/novo.
if (estoqueAntes) { applySaleStock(estoqueSnapshot, +1); delete sale.stockApplied; }
if (estoqueFisicoAntes) { applyPhysicalSaleStock(estoqueSnapshot, +1); delete sale.physicalStockApplied; }
if (sale.iptvStockApplied) { reverseIptvImmediateStockOnce(estoqueSnapshot); }
if (estoqueAgora) { applySaleStock(sale, -1); sale.stockApplied = true; }
if (sale.status === "pago" && !crediarioAgora) applyIptvImmediateStockOnce(sale);
if (crediarioAgora) { applyPhysicalStockOnce(sale); }
const newOrder = String(data.orderNumber || "").replace(/\D/g, "");
if (newOrder && newOrder !== String(sale.orderNumber || "")) {
const duplicado = state.db.sales.some(x => x.id !== sale.id && String(x.orderNumber || "") === newOrder);
if (duplicado) return toast("Já existe um pedido com este número.", "error");
sale.orderNumber = newOrder;
}
sale.barcode = String(data.barcode || "").replace(/\D/g, "") || sale.barcode;
sale.clientId = data.clientId;
sale.date = data.date;
const vencimentoAnterior = sale.dueDate;
sale.dueDate = data.dueDate;
// Ao alterar o vencimento principal, sincroniza automaticamente todas as parcelas.
// A primeira recebe a nova data e as seguintes mantêm o intervalo mensal.
if (Array.isArray(sale.crediario) && sale.crediario.length && data.dueDate && data.dueDate !== vencimentoAnterior) {
  sale.crediario.forEach((inst, idx) => {
    inst.dueDate = addInterval(data.dueDate, "meses", idx);
  });
}
sale.method = String(data.method || sale.method || "Pix");
sale.notes = (data.notes || "").trim();
// Bônus zera a mensalidade; desconto manual continua valendo sobre o resto
const bonusMonthsEdit = num(data.bonusMonths);
const bdEdit = saleDiscountBreakdown(sale.items, bonusMonthsEdit, data.discount, data.taxa);
sale.bonus = { ...(sale.bonus || {}), months: bonusMonthsEdit, discount: bdEdit.bonus };
sale.subtotal = bdEdit.subtotal;
sale.discount = bdEdit.total;
sale.taxa = bdEdit.taxa;
sale.discountManual = bdEdit.manual;
sale.discountBonus = bdEdit.bonus;
sale.discountGift = bdEdit.gift;
sale.giftCost = bdEdit.giftCost;
sale.bonusCost = bdEdit.bonusCost;
sale.total = bdEdit.liquido;
sale.costTotal = (sale.items || []).reduce((s, i) => s + Number(i.qty || 0) * Number(i.cost || 0), 0) + (bdEdit.bonusCost || 0);
// Reconcilia o bônus somente quando o pedido antigo ou o novo é Pago/Crediário.
if (estoqueAntes || estoqueAgora) {
  if (estoqueAntes && sale.bonusStock) {
    const bpOld = byId("products", sale.bonusStock.productId);
    if (bpOld) bpOld.stock = Number(bpOld.stock || 0) + Number(sale.bonusStock.qty || 0);
  }
  if (estoqueAgora) {
    sale.bonusStock = bonusStockFor(sale.items, bonusMonthsEdit);
    if (sale.bonusStock) {
      const bpNew = byId("products", sale.bonusStock.productId);
      if (bpNew) bpNew.stock = Number(bpNew.stock || 0) - Number(sale.bonusStock.qty || 0);
    }
  } else {
    delete sale.bonusStock;
  }
} else {
  delete sale.bonusStock;
}
const novoStatus = data.status;
sale.status = novoStatus;
// Caixa do pedido:
// - Crediário: mantém somente as entradas individuais já pagas das parcelas.
// - Pago: remove lançamentos anteriores da venda/crediário e cria UMA entrada pelo total.
// - Outros status: não mantém entrada de venda.
if (novoStatus === "crediario") {
state.db.cash = state.db.cash.filter(m =>
!(m.refType === "venda" && m.refId === sale.id && m.category !== "Crediário")
);
} else {
state.db.cash = state.db.cash.filter(m =>
!((m.refType === "venda" && m.refId === sale.id) ||
(m.refType === "crediario" && String(m.refId || "").startsWith(`parcela:${sale.id}:`)))
);
}
if (novoStatus === "pago") applySalePayment(sale, false);
// Reverte a baixa IPTV quando uma parcela antes paga foi desmarcada; novas parcelas pagas baixam 1 unidade.
(sale.crediario || []).forEach((inst, idx) => {
  const antiga = parcelasAntes[idx];
  if (antiga?.status === "pago" && inst.status !== "pago") {
    if (antiga.stockDeducted) { sale.crediario[idx].stockDeducted = true; reverseIptvInstallmentStock(sale, idx); }
  } else if (inst.status === "pago") {
    applyIptvInstallmentStock(sale, idx);
  }
});
// Remove qualquer saída antiga de brinde; o custo já foi pago na compra
applyGiftCost(sale);
state.editSaleSnapshot = null;
saveDB();
closeModal();
render();
toast("Pedido atualizado.");
}

    : "";

  const gruposItens = new Map();
  (sale.items || []).forEach(item => {
    const product = byId("products", item.productId) || {};
    const gift = isGiftItem(item);
    const bonus = !gift && bonusInfo.months > 0 && isPlanItem(item);
    const unit = gift ? Number(item.giftPrice ?? 0) : Number(item.price || 0);
    const key = `${stripAccents(item.name || "")}|${unit}|${gift ? "brinde" : bonus ? "bonus" : "normal"}`;
    if (!gruposItens.has(key)) {
      gruposItens.set(key, {
        barcode: product.barcode || sale.barcode || "",
        name: item.name || product.name || "Produto",
        qty: 0,
        price: unit,
        total: 0,
        gift,
        bonus
      });
    }
    const group = gruposItens.get(key);
    const quantity = Math.max(1, Number(item.qty || 1));
    group.qty += quantity;
    group.total += quantity * (gift ? 0 : unit);
  });

  const itemGroups = Array.from(gruposItens.values());
  const itensHtml = itemGroups.length
    ? itemGroups.map(item => {
        const tipo = item.gift ? "brinde" : item.bonus ? "bonus" : "";
        const badge = tipo ? `<span class="pedido-badge ${tipo}">${tipo === "bonus" ? "BÔNUS" : "BRINDE"}</span>` : "";
        return `<tr class="${tipo ? `item-${tipo}` : ""}">
          <td class="pedido-qty">${escapeText(item.qty)}</td>
          <td class="pedido-barcode">${escapeText(item.barcode || "—")}</td>
          <td class="pedido-description"><span class="pedido-description-wrap">${badge}<span>${escapeText(item.name)}</span></span></td>
          <td class="pedido-money">${item.gift ? `<s>${money(item.price)}</s>` : money(item.price)}</td>

          ? `<div class="pedido-summary-line"><span>Desconto</span><strong>${money(0)}</strong></div>`
          : "")
  ].join("");

  const footerText = docFooterText(isOrcamento, {

    cliente: client.name || "",
    total: money(sale.total)
  });

async function saveAuthSettings(event) {
  event.preventDefault();
  const form = event.target;
  if (!form.reportValidity()) return;
  const data = Object.fromEntries(new FormData(form).entries());
  data.email = String(data.email || '').trim();
  data.currentPassword = String(data.currentPassword || '');
  data.newPassword = String(data.newPassword || '');
