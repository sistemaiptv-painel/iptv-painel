<style>
:root {
--bg-0: #05070a;
--bg-1: #0a0e14;
--bg-2: #0f1520;
--bg-3: #141c2b;
--line: rgba(140, 180, 255, 0.08);
--line-strong: rgba(140, 180, 255, 0.16);
--ink: #e6edf7;
--ink-dim: #8a97b0;
--muted: #5b6a85;
--accent: #4ade80;
--accent-2: #22d3ee;
--accent-3: #a78bfa;
--danger: #f87171;
--warn: #fbbf24;
--info: #60a5fa;
--gradient: linear-gradient(135deg, #22d3ee 0%, #a78bfa 50%, #4ade80 100%);
--shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
--shadow-glow: 0 0 40px rgba(74, 222, 128, 0.15);
--radius: 14px;
--radius-lg: 20px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
color: var(--ink);
background: var(--bg-0);
background-image:
radial-gradient(1000px 500px at 10% -10%, rgba(34, 211, 238, 0.10), transparent 60%),
radial-gradient(800px 500px at 100% 5%, rgba(167, 139, 250, 0.10), transparent 60%),
radial-gradient(700px 500px at 50% 110%, rgba(74, 222, 128, 0.08), transparent 60%);
font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
overflow-x: hidden;
font-size: 14px;
line-height: 1.5;
}

/* ===== LAYOUTS PERSONALIZÁVEIS ===== */
body.theme-light {
  --bg-0: #f4f7fb;
  --bg-1: #ffffff;
  --bg-2: #eef3f9;
  --bg-3: #e5ebf3;
  --line: rgba(20, 35, 60, 0.10);
  --line-strong: rgba(20, 35, 60, 0.18);
  --ink: #182235;
  --ink-dim: #5d6b80;
  --muted: #7a8799;
  --accent: #16a34a;
  --accent-2: #0891b2;
  --accent-3: #7c3aed;
  --shadow: 0 16px 45px rgba(30, 55, 90, 0.12);
  background: var(--bg-0);
  background-image:
    radial-gradient(900px 450px at 0% -10%, rgba(34, 211, 238, .12), transparent 60%),
    radial-gradient(700px 450px at 100% 0%, rgba(124, 58, 237, .10), transparent 60%);
}
body.theme-light::before {
  opacity: .18;
  background-image:
    linear-gradient(90deg, rgba(30, 55, 90, .045) 1px, transparent 1px),
    linear-gradient(rgba(30, 55, 90, .045) 1px, transparent 1px);
}
body.theme-light .topnav { background: #ffffff; }
body.theme-light .card { background: #ffffff; }
/* Tema claro de alto contraste: branco limpo, texto escuro e superfícies nítidas. */
body.theme-light {
  --bg-0: #ffffff;
  --bg-1: #ffffff;
  --bg-2: #f8fafc;
  --bg-3: #f1f5f9;
  --line: rgba(15, 23, 42, .12);
  --line-strong: rgba(15, 23, 42, .20);
  --ink: #111827;
  --ink-dim: #374151;
  --muted: #4b5563;
  --shadow: 0 8px 24px rgba(15, 23, 42, .08);
  --shadow-glow: 0 0 24px rgba(34, 211, 238, .08);
  color: #111827;
  background: #ffffff;
  background-image: none;
}
body.theme-light::before { opacity: .16; }
body.theme-light .topnav {
  background: rgba(255,255,255,.98);
  border-bottom: 1px solid #e5e7eb;
  box-shadow: 0 4px 14px rgba(15,23,42,.06);
}
body.theme-light .card,
body.theme-light .section-card {
  color: #111827;
  background: #ffffff;
  border-color: #e5e7eb;
  box-shadow: 0 7px 22px rgba(15,23,42,.07);
}
body.theme-light .section-title h3,
body.theme-light h1, body.theme-light h2, body.theme-light h3,
body.theme-light h4, body.theme-light strong,
body.theme-light .brand-text, body.theme-light .nav button {
  color: #111827;
}
body.theme-light p, body.theme-light .muted,
body.theme-light .section-title p, body.theme-light small,
body.theme-light label, body.theme-light .field-hint {
  color: #4b5563;
}
body.theme-light input:not([type="checkbox"]):not([type="radio"]),
body.theme-light select, body.theme-light textarea {
  color: #111827;
  background: #ffffff;
  border-color: #cbd5e1;
}
body.theme-light input::placeholder, body.theme-light textarea::placeholder {
  color: #6b7280;
  opacity: 1;
}
body.theme-light .table-wrap table,
body.theme-light table { color: #111827; }
body.theme-light th {
  color: #374151;
  background: #f8fafc;
  border-color: #e5e7eb;
}
body.theme-light td { border-color: #e5e7eb; }
body.theme-light .dashboard-highlight,
body.theme-light .mini-item,
body.theme-light .sale-selected-card,
body.theme-light .filter-bar {
  color: #111827;
  background-color: #f8fafc;
  border-color: #e5e7eb;
}
/* Status e valores sinalizados mantêm as cores semânticas (pago, pendente, alerta). */
body.theme-light .pill, body.theme-light .status-pill,
body.theme-light .ok-text, body.theme-light .danger-text,
body.theme-light .warn-text, body.theme-light .success-text,
body.theme-light .info-text { color: inherit; }
body.theme-light .ok-text { color: #15803d; }
body.theme-light .danger-text { color: #b91c1c; }
body.theme-light .warn-text { color: #a16207; }
body.theme-light .info-text { color: #1d4ed8; }

body.theme-blue {
  --bg-0: #07111f;
  --bg-1: #0b1728;
  --bg-2: #102238;
  --bg-3: #142b45;
  --line: rgba(90, 180, 255, .11);
  --line-strong: rgba(90, 180, 255, .20);
  --ink: #eaf6ff;
  --ink-dim: #91abc4;
  --muted: #637f9c;
  --accent: #38bdf8;
  --accent-2: #60a5fa;
  --accent-3: #818cf8;
  --gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 55%, #22d3ee 100%);
  background: var(--bg-0);
  background-image:
    radial-gradient(1000px 500px at 0% -10%, rgba(56,189,248,.15), transparent 60%),
    radial-gradient(800px 500px at 100% 5%, rgba(99,102,241,.13), transparent 60%);
}
body.theme-blue .topnav { background: rgba(7,17,31,.88); }

body.layout-compact {
  font-size: 13px;
}
body.layout-compact .topnav { height: 52px; padding: 0 14px; }
body.layout-compact .nav button { padding: 6px 9px; height: 32px; font-size: 12px; }
body.layout-compact .main { padding: 16px; }
body.layout-compact .card { padding: 15px; border-radius: 14px; }
body.layout-compact .metric { min-height: 88px; gap: 5px; }
body.layout-compact .metric-value { font-size: 22px; }
body.layout-compact .section-title { margin-bottom: 10px; }
body.layout-compact .grid { gap: 10px; }

/* Painel: cards menores, mais limpos e com leitura rápida */
.dashboard-metrics {
  gap: 10px !important;
}
.dashboard-metrics .metric {
  min-height: 88px;
  padding: 14px !important;
  gap: 5px;
}
.dashboard-metrics .metric-label {
  font-size: 10px;
  letter-spacing: .08em;
}
.dashboard-metrics .metric-value {
  font-size: 21px;
  line-height: 1.15;
}
.dashboard-metrics .metric-hint {
  font-size: 11px;
}

/* Bloco visual do gráfico do painel */
.dashboard-chart-card {
  min-height: 300px;
}
.dashboard-chart-wrap {
  display: grid;
  grid-template-columns: 180px 1fr;
  align-items: center;
  gap: 22px;
  min-height: 230px;
}
.dashboard-pie {
  width: 172px;
  height: 172px;
  border-radius: 50%;
  position: relative;
  margin: auto;
  box-shadow: 0 14px 35px rgba(0,0,0,.20);
}
.dashboard-pie::after {
  content: "";
  position: absolute;
  inset: 35px;
  border-radius: 50%;
  background: var(--bg-1);
  border: 1px solid var(--line);
  box-shadow: inset 0 0 0 8px rgba(255,255,255,.02);
}
.dashboard-pie-center {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 2;
  text-align: center;
  pointer-events: none;
}
.dashboard-pie-center strong {
  font-family: "JetBrains Mono", monospace;
  font-size: 17px;
}
.dashboard-pie-center span {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}
.pie-legend {
  display: grid;
  gap: 9px;
}
.pie-legend-item {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.pie-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.pie-legend-item strong {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
}
.dashboard-highlight {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 13px;
  margin-top: 10px;
  border-radius: 12px;
  background: rgba(34,211,238,.055);
  border: 1px solid var(--line);
}
.dashboard-highlight small { color: var(--muted); }
.dashboard-highlight strong { font-size: 13px; }

.layout-option {
  width: 100%;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  margin-bottom: 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.layout-option:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
}
.layout-option.active {
  border-color: rgba(34,211,238,.45);
  background: rgba(34,211,238,.08);
}
.layout-preview {
  width: 38px;
  height: 30px;
  border-radius: 8px;
  flex: 0 0 auto;
  border: 1px solid var(--line-strong);
}
.layout-preview.dark { background: linear-gradient(135deg,#05070a,#141c2b); }
.layout-preview.light { background: linear-gradient(135deg,#fff,#e9eff7); }
.layout-preview.blue { background: linear-gradient(135deg,#07111f,#1b3d63); }
.layout-preview.compact { background: linear-gradient(135deg,#0a0e14,#22d3ee); box-shadow: inset 0 0 0 5px rgba(255,255,255,.08); }
.layout-option-text strong { display:block; font-size:13px; }
.layout-option-text span { display:block; font-size:11px; color:var(--muted); margin-top:2px; }

@media (max-width: 850px) {
  .dashboard-chart-wrap { grid-template-columns: 1fr; }
  .dashboard-pie { width: 145px; height: 145px; }
  .dashboard-pie::after { inset: 30px; }
}

body::before {
content: "";
position: fixed;
inset: 0;
pointer-events: none;
opacity: 0.4;
background-image:
linear-gradient(90deg, rgba(140, 180, 255, 0.03) 1px, transparent 1px),
linear-gradient(rgba(140, 180, 255, 0.03) 1px, transparent 1px);
background-size: 40px 40px;
mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
z-index: -1;
}
/* ===== REDESIGN VISUAL DO PAINEL ===== */
:root { --panel-border: rgba(148,163,184,.14); }
body { background-image: radial-gradient(900px 520px at 12% -12%, rgba(34,211,238,.15), transparent 62%), radial-gradient(780px 480px at 98% 0%, rgba(167,139,250,.14), transparent 62%), radial-gradient(720px 500px at 50% 112%, rgba(52,211,153,.09), transparent 64%); }
.topnav { height: 64px; padding: 0 24px; background: rgba(5,10,19,.78); border-bottom-color: rgba(148,163,184,.16); box-shadow: 0 10px 30px rgba(0,0,0,.16); }
.brand { padding-right: 24px; margin-right: 18px; }
.brand-logo { width: 36px; height: 36px; border-radius: 11px; box-shadow: 0 0 24px rgba(34,211,238,.24); }
.nav { gap: 5px; }
.nav button { height: 38px; padding: 8px 13px; border-radius: 10px; }
.nav button.active { background: linear-gradient(135deg, rgba(34,211,238,.16), rgba(167,139,250,.14)); border-color: rgba(34,211,238,.24); color: #e8fbff; }
.main { max-width: 1640px; width: 100%; margin: 0 auto; padding: 28px 26px 44px; }
.card { background: linear-gradient(145deg, rgba(15,23,42,.78), rgba(8,14,25,.72)); border: 1px solid var(--panel-border); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.025); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
.card:hover { border-color: rgba(148,163,184,.24); box-shadow: 0 22px 58px rgba(0,0,0,.26), 0 0 0 1px rgba(34,211,238,.025); }
.topbar-purchase-filters { flex: 1 1 auto; min-width: 420px; max-width: 760px; }
.topbar-purchase-filters .filter-bar { margin: 0; padding: 0; border: 0; background: transparent; display: flex; align-items: end; gap: 7px; }
.topbar-purchase-filters .filter-bar label { min-width: 110px; font-size: 9px; }
.topbar-purchase-filters .filter-bar label:nth-child(3) { min-width: 210px; }
.topbar-purchase-filters .filter-bar input, .topbar-purchase-filters .filter-bar select { height: 32px; padding: 6px 8px; font-size: 11px; }
.topbar-purchase-filters .filter-actions { margin-left: 0; }
.topbar-purchase-filters .filter-actions button { height: 32px; padding: 6px 9px; font-size: 10px; }
@media (max-width: 1200px) { .topbar-purchase-filters { order: 3; flex-basis: 100%; max-width: none; min-width: 0; margin-top: 10px; } .topbar-purchase-filters .filter-bar { flex-wrap: wrap; } }
.dashboard-metrics { gap: 14px !important; }
.dashboard-metrics .metric { position: relative; overflow: hidden; min-height: 118px; padding: 20px !important; border-radius: 18px; background: linear-gradient(135deg, rgba(15,23,42,.95), rgba(10,18,32,.82)); border-color: rgba(148,163,184,.16); box-shadow: 0 14px 36px rgba(0,0,0,.18); }
.dashboard-metrics .metric::after { content: ""; position: absolute; width: 110px; height: 110px; right: -34px; bottom: -52px; border-radius: 50%; background: rgba(34,211,238,.08); }
.dashboard-metrics .metric:nth-child(2)::after { background: rgba(52,211,153,.09); }
.dashboard-metrics .metric:nth-child(3)::after { background: rgba(251,191,36,.10); }
.dashboard-metrics .metric:nth-child(4)::after { background: rgba(167,139,250,.10); }
.dashboard-metrics .metric-value { font-size: 27px; letter-spacing: -.04em; }
.dashboard-metrics .metric-label { color: #a7b6cc; font-size: 10px; font-weight: 700; letter-spacing: .12em; }
.dashboard-metrics .metric-hint { color: #71829c; font-size: 11px; }
.dashboard-chart-card, .dashboard-chart-card + .card { min-height: 330px; }
.dashboard-chart-card .section-title, .dashboard-chart-card + .card .section-title { margin-bottom: 17px; }
.dashboard-chart-wrap { grid-template-columns: 210px 1fr; gap: 30px; min-height: 250px; }
.dashboard-dual-pies { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; min-height: 250px; }
.dashboard-pie-panel { min-width: 0; padding: 14px; border: 1px solid rgba(148,163,184,.10); border-radius: 15px; background: rgba(3,8,18,.24); }
.dashboard-pie-panel.expense-pie { border-color: rgba(239,68,68,.24); background: linear-gradient(145deg, rgba(127,29,29,.10), rgba(3,8,18,.24)); }
.dashboard-pie-wrap { display: grid; justify-items: center; gap: 8px; }
.dashboard-pie-panel .dashboard-pie { width: 150px; height: 150px; }
.dashboard-pie-panel .dashboard-pie::after { inset: 34px; }
.dashboard-pie-total { font-size: 16px; color: var(--ink); }
.expense-pie .dashboard-pie-total { color: #fca5a5; }
.expense-pie .pie-dot { box-shadow: 0 0 12px rgba(239,68,68,.45); }
.dashboard-pie-empty { min-height: 220px; display: grid; place-items: center; text-align: center; }
@media (max-width: 850px) { .dashboard-dual-pies { grid-template-columns: 1fr; } .dashboard-pie-panel .dashboard-pie { width: 160px; height: 160px; } }
.dashboard-pie { width: 190px; height: 190px; box-shadow: 0 0 0 10px rgba(255,255,255,.025), 0 18px 45px rgba(0,0,0,.30); }
.dashboard-pie::after { inset: 42px; background: #0b1423; border-color: rgba(148,163,184,.14); }
.pie-legend { gap: 13px; padding: 6px 0; }
.pie-legend-item { grid-template-columns: 11px 1fr auto; gap: 10px; font-size: 13px; color: #c8d4e5; }
.pie-legend-item strong { color: #f8fafc; font-size: 12px; }
.pie-dot { width: 10px; height: 10px; box-shadow: 0 0 12px currentColor; }
.mini-list { display: grid; gap: 9px; }

function addFinancialMessageTags(db) {
  const templates = db?.settings?.templates;
  if (!templates) return db;
  Object.keys(templates).forEach(key => {
    if (!templates[key]) return;
    let text = String(templates[key]);
    if (!text.includes("{desconto}")) text += "\nDesconto: {desconto}";
    if (!text.includes("{taxa}")) text += "\nTaxa: {taxa}";
    if (!text.includes("{valor_parcela}")) text += "\nValor da parcela: {valor_parcela}";
    if (!text.includes("{total_pago}")) text += "\nTotal pago: {total_pago}";
    if (!text.includes("{total_a_pagar}")) text += "\nTotal a pagar: {total_a_pagar}";
    templates[key] = text;
  });
  return db;
}

// CORREÇÃO: bônus e brinde não geram nova saída no caixa.

if (merged.cash) merged.cash = merged.cash.filter(m =>

);

}

salesWithIndex.sort((a, b) => {

});

let remoteSyncReady = false;
let remoteSyncBusy = false;
let remoteSyncPending = false;
let localRestorePending = false;

function saveDB() {
  state.db.meta = state.db.meta || {};
  state.db.meta.updatedAt = new Date().toISOString();
  try { localStorage.setItem(DB_KEY, JSON.stringify(state.db)); }
  catch (err) { console.warn('LocalStorage cheio; os dados seguirão para o servidor quando disponível:', err); }
  remoteSyncPending = true;
  // Arquivo aberto diretamente do computador só pode salvar localmente.
  // Não exibe falso erro de servidor nesse modo; para sincronizar, use o endereço HTTPS do Render.
  if (location.protocol === "file:") return;
  if (!remoteSyncReady || remoteSyncBusy) return;
  remoteSyncBusy = true;
  remoteSyncPending = false;
  fetch('/api/db', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(state.db)
  }).then(res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
  }).catch(err => {
    console.warn('Não foi possível salvar no servidor:', err);
    const detalhe = err?.message ? ` (${err.message})` : "";
    toast(`Não foi possível salvar no servidor${detalhe}`, 'error');
  }).finally(() => {
    remoteSyncBusy = false;
    if (remoteSyncPending && remoteSyncReady) saveDB();
  });
}

function mergeRemoteDB(remote) {
  const seed = seedDB();
  return { ...seed, ...remote,
    attachments: Array.isArray(remote.attachments) ? remote.attachments : (seed.attachments || []),
    settings: { ...seed.settings, ...(remote.settings || {}),
      templates: { ...seed.settings.templates, ...((remote.settings || {}).templates || {}) },
      docs: { ...seed.settings.docs, ...((remote.settings || {}).docs || {}) }
    }
  };
}

async function loadDBFromServer() {
  if (location.protocol === "file:") return;
  try {
    const response = await fetch('/api/db', { cache: 'no-store' });
    if (response.status === 401) { remoteSyncReady = true; return; }
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const remote = await response.json();
    if (remote && typeof remote === 'object' && Object.keys(remote).length && !localRestorePending) {
      state.db = mergeRemoteDB(remote);
      try { localStorage.setItem(DB_KEY, JSON.stringify(state.db)); } catch (storageErr) { console.warn("Banco remoto carregado; cache local cheio:", storageErr); }
      applyLayout();
      render();
    } else {
      // Primeiro uso do servidor: envia a base local já existente para o banco do celular.
      // Assim, dados cadastrados antes da instalação do servidor não ficam apenas no navegador.
      remoteSyncReady = true;
      saveDB();
    }
    remoteSyncReady = true;
    if (localRestorePending) {
      localRestorePending = false;
      saveDB();
    }
    await migrateLegacySaleAttachments();
  } catch (err) {
    console.warn('Não foi possível carregar do servidor; mantendo dados locais:', err);
    remoteSyncReady = true;
    toast('Servidor indisponível; dados locais mantidos', 'error');
  }
}
function toast(msg, type = "ok") {
let node = $(".toast");
if (!node) {
node = document.createElement("div");
node.className = "toast";
document.body.appendChild(node);
}
node.className = "toast" + (type === "error" ? " error" : "");
node.textContent = msg;
requestAnimationFrame(() => node.classList.add("show"));
clearTimeout(node._t);
node._t = setTimeout(() => node.classList.remove("show"), 2600);
}

function normalizeProductTypes(types) {
  const defaults = [{id: "iptv", name: "Plano IPTV"}, {id: "produto", name: "Produto"}, {id: "brinde", name: "Brinde"}];
  const source = Array.isArray(types) && types.length ? types : defaults;
  const result = [], ids = new Set();
  source.forEach((item, index) => {
    const name = String(typeof item === "string" ? item : item?.name || "").trim();
    if (!name) return;
    const base = String(typeof item === "string" ? item : item?.id || name).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || `tipo-${index + 1}`;
    let id = base, n = 2;
    while (ids.has(id)) id = `${base}-${n++}`;
    ids.add(id); result.push({id, name});
  });
  return result.length ? result : defaults;
}

const STATUS_FINANCEIROS = ["pago", "pendente", "crediario", "cancelado"];
function isStatusFinanceiro(status) {

// O status do pedido pode ser operacional (ex.: Faturado), enquanto o pagamento

// A baixa registrada no Caixa é a fonte final para decidir se o pedido está pago.
function statusBaixaVendaNoCaixa(sale) {
if (!sale) return "";
const moves = (state.db.cash || []).filter(m =>
  (m.refType === "venda" || m.refType === "venda_pendente") && String(m.refId || "") === String(sale.id)
);
if (!moves.length) return "";
if (moves.some(m => String(m.status || "pago") === "pendente")) return "pendente";
if (moves.some(m => String(m.status || "pago") === "pago")) return "pago";
if (moves.every(m => String(m.status || "pago") === "cancelado")) return "cancelado";
return "";
}
function statusPagamentoVenda(sale) {
if (!sale) return "pendente";
const baixaCaixa = statusBaixaVendaNoCaixa(sale);
if (baixaCaixa) return baixaCaixa;
if (isStatusFinanceiro(sale.paymentStatus)) return sale.paymentStatus;
if (isStatusFinanceiro(sale.status)) return sale.status;
const relacionados = (state.db.cash || []).filter(m =>
  m.refType === "venda" && String(m.refId || "") === String(sale.id)
);
if (relacionados.length) return relacionados.some(m => m.status === "pendente") ? "pendente" : "pago";

function getTotals() {
const month = today().slice(0, 7);
const sales = state.db.sales.filter(s => s.status !== "orcamento" && s.status !== "cancelado");
const paidCash = state.db.cash.filter(m => (m.status || "pago") === "pago");
const income = paidCash.filter(m => m.type === "entrada").reduce((a, m) => a + Number(m.amount || 0), 0);
const expenses = paidCash.filter(m => m.type === "saida").reduce((a, m) => a + Number(m.amount || 0), 0);
const balance = income - expenses;
// O que falta receber é calculado por parcela; pedidos sem parcelas entram pelo total uma única vez.
const receivableInstallments = sales.reduce((sum, s) => {
  const parcelas = Array.isArray(s.crediario) ? s.crediario : [];
  if (!parcelas.length) return sum;
  return sum + parcelas.filter(i => !["pago", "cancelado"].includes(String(i.status || "").toLowerCase()))
    .reduce((v, i) => v + Number(i.amount ?? i.valor ?? 0), 0);
}, 0);
const receivableSales = sales.filter(s => !(Array.isArray(s.crediario) && s.crediario.length) && statusPagamentoVenda(s) === "pendente")
  .reduce((a, s) => a + Number(s.total || 0), 0);
const receivable = receivableSales + receivableInstallments;
const payable = state.db.purchases.filter(p => !["pago", "cancelado", "orcamento"].includes(p.status))
  .reduce((a, p) => a + (purchaseInstallments(p).length ? purchaseOpenAmount(p) : Number(p.total || 0)), 0);
// Vendas realizadas representam somente entradas de venda/crediário já lançadas no Caixa.
const salesCash = paidCash.filter(m => m.type === "entrada" && ["venda", "crediario"].includes(m.refType));
const salesTotal = salesCash.reduce((a, m) => a + Number(m.amount || 0), 0);
const salesCount = new Set(salesCash.map(m => String(m.refType) + ":" + String(m.refType === "crediario" ? (m.refId || "").split(":").slice(0, 2).join(":") : m.refId))).size;
const revenue = paidCash.filter(m => m.type === "entrada" && String(m.date || "").slice(0, 7) === month)
  .reduce((a, m) => a + Number(m.amount || 0), 0);
const cost = sales.filter(s => statusPagamentoVenda(s) === "pago" && String(s.date || "").slice(0, 7) === month)
  .reduce((a, s) => a + Number(s.costTotal || 0), 0);
// ATRASADOS: somente vendas/parcelas não pagas com vencimento anterior a hoje.
const overdueRows = vencimentosTodos().filter(v =>
  (v.tipo === "venda" || v.tipo === "parcela") && v.dueDate && v.dueDate < today()
);
const overdue = Array.from(new Map(overdueRows.map(v => [
  v.clientId || v.saleId || v.nome, v
])).values());
const lowStock = state.db.products.filter(p => Number(p.stock) <= Number(p.minStock));
return { revenue, profit: revenue - cost, receivable, payable, balance, income, expenses, salesTotal, salesCount, overdue, lowStock };
}

// Limites de cada janela: mês atual, próximos 7 dias e mês que vem.
function vencJanela(modo) {
const hoje = today();
const ini = hoje.slice(0, 8) + "01";
const [y, m] = [Number(hoje.slice(0, 4)), Number(hoje.slice(5, 7))];
const ultimoDia = (yy, mm) => new Date(yy, mm, 0).getDate();
const fmt = (yy, mm, dd) => `${yy}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
if (modo === "atrasados") return { from: "", to: addDays(hoje, -1), label: "Atrasados" };
if (modo === "7dias") return { from: hoje, to: addDays(hoje, 7), label: "Próximos 7 dias" };
if (modo === "proximo") {
const py = m === 12 ? y + 1 : y, pm = m === 12 ? 1 : m + 1;
return { from: fmt(py, pm, 1), to: fmt(py, pm, ultimoDia(py, pm)), label: "Mês que vem" };
}
return { from: ini, to: fmt(y, m, ultimoDia(y, m)), label: "Mês atual" };
}
// Junta somente obrigações que realmente possuem vencimento próprio:

// Nunca usar a data/valor geral do pedido quando existem parcelas cadastradas.

function agendaFilteredRows() {

function saveStockAdjust(event, id) {
event.preventDefault();
const p = byId("products", id);
if (!p) return;
const data = Object.fromEntries(new FormData(event.target).entries());
const qty = num(data.qty);
const prev = Number(p.stock || 0);
if (data.op === "add") p.stock = prev + qty;
else if (data.op === "sub") p.stock = prev - qty; // pode ficar negativo (venda sem estoque)
else p.stock = qty; // permite definir valor negativo
const reason = data.reason.trim() || "Ajuste manual";
state.db.cash.push({
id: uid("cai"), date: today(), type: data.op === "sub" ? "saida" : "entrada",
category: "Estoque", description: `Ajuste: ${p.name} — ${reason}`,
amount: 0, method: "Manual", refType: "ajuste", refId: id
});
saveDB();
closeModal();
render();
toast(`Estoque atualizado: ${p.name} → ${p.stock} unid.`);
}
function clientCreditBalance(client) {
  if (!client) return 0;
  if (client.creditBalance !== undefined && client.creditBalance !== null && Number.isFinite(Number(client.creditBalance))) {
    return Math.max(0, Number(client.creditBalance));
  }
  const sales = (state.db.sales || []).filter(sale => String(sale.clientId) === String(client.id));
  return Math.max(0, sales.reduce((sum, sale) => {
    const received = Number(sale.cashReceived || 0);
    const used = Number(sale.creditUsed || 0);
    const created = sale.creditCreated !== undefined ? Number(sale.creditCreated || 0) : Math.max(0, received + used - Number(sale.total || 0));
    return sum + created - used;
  }, 0));
}

function regenMatricula() {

// Avisa em tempo real se o código digitado já pertence a outro cliente
function onMatriculaInput(el) {
const aviso = document.getElementById("matriculaAviso");
if (!aviso) return;
const form = el.closest("form");
const meuId = form ? (form.elements["id"]?.value || "") : "";
const valor = (el.value || "").trim();
if (!valor) {
aviso.className = "danger-text";
aviso.textContent = "Informe um código ou clique em Gerar.";
return;
}
const dono = matriculaEmUso(valor, meuId);
if (dono) {
aviso.className = "danger-text";
aviso.textContent = `Este código já é de ${dono.name}. Escolha outro.`;
} else {
aviso.className = "muted";
aviso.textContent = "Código disponível — pode alterar manualmente se quiser.";
}
}
function saveClient(event) {
event.preventDefault();
const pending = document.getElementById("macInputInline");
if (pending && pending.value.trim()) addMacFromInput();
syncMacNamesFromForm();
const macNames = {};
state.macDraft.forEach((mac, index) => { if (state.macDraftNames?.[index]) macNames[mac] = state.macDraftNames[index]; });
const macDevices = state.macDraft.map((mac, index) => ({mac: normalizeMac(mac), name: state.macDraftNames?.[index] || ""})).filter(d => d.mac);
const data = Object.fromEntries(new FormData(event.target).entries());
const clientId = data.id || uid("cli");
const existente = data.id ? byId("clients", data.id) : null;
// Código de indicação: aceita alteração manual, mas não deixa repetir.
// Se ficar em branco, gera automático.
const matriculaInformada = String(data.matricula || "").trim();
const matriculaFinal = matriculaInformada || genMatricula();
const donoDoCodigo = matriculaEmUso(matriculaFinal, clientId);
if (donoDoCodigo) return toast(`Código de indicação ${matriculaFinal} já é de ${donoDoCodigo.name}. Use outro.`, "error");
const client = {
id: clientId,
name: data.name.trim(),
phone: String(data.phone || "").trim(),
email: data.email.trim(),
cpf: (data.cpf || "").trim(),
type: data.type,
color: data.color || "#22d3ee",
matricula: matriculaFinal,
macs: state.macDraft.map(normalizeMac).filter(Boolean),
macNames,
macDevices,
device: data.device.trim(),
planProductId: data.planProductId,
// O campo de vencimento saiu do formulário do cliente. O dado continua existindo e é
// mantido automaticamente pelo sistema: a baixa de uma venda com plano empurra a data
// para frente (applySalePayment) e o crediário grava a 1ª parcela. Aqui só preservamos
// o valor atual — em cliente novo começa vazio e é definido na primeira venda.
dueDate: existente?.dueDate || "",
// Data de cadastro: em cliente novo, hoje. Ao editar, preserva a original se o campo ficar vazio.
createdDate: data.createdDate || existente?.createdDate || today(),
active: data.active === "true",
address: data.address.trim(),
addressNumber: data.addressNumber.trim(),
neighborhood: data.neighborhood.trim(),
zipCode: data.zipCode.trim(),
city: data.city.trim(),
reference: data.reference.trim(),
indicatedBy: data.indicatedBy.trim(),
listData: data.listData.trim(),
notes: data.notes.trim()
};
const idx = state.db.clients.findIndex(c => c.id === client.id);
if (idx >= 0) state.db.clients[idx] = client; else state.db.clients.push(client);
state.macDraft = [];
state.macDraftNames = [];
saveDB();
closeModal();
render();
toast("Cadastro salvo.");
}

function printProduct(id) {

}
function printProducts() {
const f = getFilters("produtos");
let products = applyFilters("produtos", state.db.products, { date: p => p.createdDate || "" });
const q = stripAccents(state.query || "");
if (q) products = products.filter(p => stripAccents([p.name, p.sku, p.type, p.notes, p.barcode].filter(Boolean).join(" ")).includes(q));
products = [...products].sort((a,b) => String(a.name || "").localeCompare(String(b.name || "")));
if (!products.length) return toast("Nenhum produto para imprimir.", "error");
const periodo = f.from || f.to ? `${f.from ? fmtDate(f.from) : "início"} até ${f.to ? fmtDate(f.to) : "hoje"}` : "Todos os produtos";
const docNumero = `PROD-${today().replace(/-/g, "")}`;
runPrint(productPrintHtml(products, "RELATÓRIO DE PRODUTOS", docNumero, periodo), `Relatório de Produtos — ${docNumero}`);
}
function randomBarcode() {
let base = "";
for (let i = 0; i < 12; i++) base += Math.floor(Math.random() * 10);
let sum = 0;
for (let i = 0; i < 12; i++) sum += Number(base[i]) * (i % 2 === 0 ? 1 : 3);
const check = (10 - (sum % 10)) % 10;
return base + check;
}
function generateProductBarcode(id) {
const p = byId("products", id);
if (!p) return;
p.barcode = randomBarcode();

//  - Se o brinde NÃO tem custo -> apenas zera o valor (nenhuma saída no caixa).

// Desconto total = brinde (zera os produtos brindados) + bônus (zera os meses) + desconto manual
// Cada um cumpre a sua regra de forma independente, limitado ao subtotal.
function saleDiscountBreakdown(items, bonusMonths, manual, taxa) {
const subtotal = (items || []).reduce((s, i) => {
const unit = isGiftItem(i) ? Number(i.giftPrice ?? i.price ?? 0) : Number(i.price || 0);
return s + Number(i.qty || 0) * unit;
}, 0);
const gift = giftDiscountFor(items);
const giftCost = giftCostFor(items);
const bonus = bonusDiscountFor(items, bonusMonths);
const bonusCost = bonusCostFor(items, bonusMonths);
const manualVal = Math.max(0, parseBRLInput(manual || 0));
const taxaVal = Math.max(0, parseBRLInput(taxa || 0));
const totalDesc = Math.min(subtotal, gift + bonus + manualVal);
return {
subtotal, gift, giftCost, bonus, bonusCost, manual: manualVal, taxa: taxaVal,
total: totalDesc, liquido: Math.max(0, subtotal - totalDesc) + taxaVal
};
}
function currentSaleTotal() {
const f = state.saleForm || {};
return saleDiscountBreakdown(state.saleDraft, f.bonusMonths, f.discount, f.taxa).liquido;
}
// Lê o bônus de uma venda já salva (recalcula em pedidos antigos, sem os campos novos)
function saleBonusInfo(sale) {
if (!sale) return { months: 0, discount: 0, manual: 0, gift: 0, giftCost: 0, giftQty: 0 };
const months = Math.max(0, Number(sale.bonus?.months || 0));
let bonus = Number(sale.discountBonus);
if (!isFinite(bonus) || bonus <= 0) {
bonus = Number(sale.bonus?.discount || 0);
if (!bonus && months) bonus = bonusDiscountFor(sale.items, months);
}
bonus = Math.max(0, Math.min(Number(sale.discount || 0), bonus || 0));
// Brinde: usa o valor gravado ou recalcula pelos itens marcados
let gift = Number(sale.discountGift);
if (!isFinite(gift) || gift < 0) gift = giftDiscountFor(sale.items);
const giftCost = isFinite(Number(sale.giftCost)) ? Number(sale.giftCost) : giftCostFor(sale.items);
const giftQty = giftItemsOf(sale).reduce((s, i) => s + Math.max(1, Number(i.qty || 1)), 0);
let manual = Number(sale.discountManual);
if (!isFinite(manual)) manual = Math.max(0, Number(sale.discount || 0) - bonus - gift);
return { months, discount: bonus, manual: Math.max(0, manual), gift: Math.max(0, gift), giftCost, giftQty };
}

    const linhaGift = b.gift > 0

    return `

// Permite digitar a 1ª parcela manualmente como DD/MM/AAAA.
// O calendário fica separado do campo de texto.
function parseDataManualBR(v) {
const m = String(v || "").trim().match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
if (!m) return "";
const d = String(m[1]).padStart(2, "0");
const mo = String(m[2]).padStart(2, "0");
const y = m[3];
const iso = `${y}-${mo}-${d}`;
const dt = new Date(`${iso}T00:00:00`);
if (Number.isNaN(dt.getTime()) ||
    dt.getFullYear() !== Number(y) ||
    dt.getMonth() + 1 !== Number(mo) ||
    dt.getDate() !== Number(d)) return "";
return iso;
}

function addSaleItem() {
captureSaleForm();
if (!state.saleProductId) return toast("Pesquise e selecione um produto.", "error");
const product = byId("products", state.saleProductId);
const qty = num($("#saleQty").value);
if (!product || qty <= 0) return toast("Selecione um item e quantidade válida.", "error");
// Avisa quando passa do disponível, mas não bloqueia a venda
const disponivel = stockDisponivel(product);
if (qty > disponivel) toast(`Atenção: ${product.name} tem apenas ${disponivel} em estoque. Estoque ficará negativo.`, "error");
state.saleDraft.push({ productId: product.id, name: product.name, type: product.type, stockType: product.stockType === "iptv" ? "iptv" : "fisico", unit: product.unit || "Unidade", qty, price: Number(product.price || 0), cost: Number(product.cost || 0), periodDays: Number(product.periodDays || 0), months: Number(product.months || 0) });
state.saleProductId = null;
if (state.saleForm?.status === "crediario") { ensureCrediario(); recalcCrediarioAmounts(); }
render();
}
// Adiciona um BRINDE ao pedido: entra como item normal (gera o pedido do produto e baixa estoque),
// porém com o valor ZERADO. Pode adicionar quantos brindes quiser — cada um cumpre a sua regra.
function filterGiftProductOptions(query) {
  const q = stripAccents(String(query || "")).toLowerCase().trim();
  const sel = document.getElementById("giftProductPick");
  if (!sel) return;
  Array.from(sel.options).forEach((op, idx) => {
    if (idx === 0) { op.hidden = false; return; }
    op.hidden = !!q && !String(op.dataset.search || "").toLowerCase().includes(q);
  });
}
function addGiftItem() {
captureSaleForm();
const sel = document.getElementById("giftProductPick");
const pid = sel ? sel.value : "";
if (!pid) return toast("Escolha o produto do brinde.", "error");
const product = byId("products", pid);
const qty = 1;
if (!product) return toast("Produto do brinde não encontrado.", "error");
const disponivel = stockDisponivel(product);
if (qty > disponivel) toast(`Atenção: ${product.name} tem apenas ${disponivel} em estoque. Estoque ficará negativo.`, "error");
const preco = Number(product.price || 0);
const custo = Number(product.cost || 0);
state.saleDraft.push({
productId: product.id, name: product.name, type: product.type, stockType: product.stockType === "iptv" ? "iptv" : "fisico", unit: product.unit || "Unidade", qty,
price: 0, giftPrice: preco, cost: custo,
periodDays: Number(product.periodDays || 0), months: Number(product.months || 0), isGift: true
});
if (state.saleForm?.status === "crediario") { ensureCrediario(); recalcCrediarioAmounts(); }
render();
const custoTotal = qty * custo;
toast(custoTotal > 0
? `Brinde ${product.name} (${qty}×) adicionado: valor zerado e ${money(custoTotal)} de custo sairá do caixa.`
: `Brinde ${product.name} (${qty}×) adicionado: valor zerado, sem custo no caixa.`);
}
function updateSaleDraftQty(index, value) {

function sortSalesRows(rows) {

  return [...rows].sort((a, b) => {
    let av;

    if (sort.field === "order") {

// Os arquivos ficam no IndexedDB, separados do LocalStorage, sem limite artificial
// imposto pelo aplicativo e aceitando qualquer formato suportado pelo navegador.
const SALE_ATTACH_DB = "iptv-manager-sale-attachments-v1";
function saleAttachDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(SALE_ATTACH_DB, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains("files")) req.result.createObjectStore("files", { keyPath: "id" }); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("Não foi possível abrir o armazenamento de anexos."));
  });
}
function saleAttachRequest(mode, value = null) {
  return saleAttachDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("files", mode === "readonly" ? "readonly" : "readwrite");
    const store = tx.objectStore("files");
    const req = mode === "readonly" ? (value ? store.get(value) : store.getAll()) : store.put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("Falha no anexo."));
  }));
}
function saleAttachKey(saleId) { return `sale:${saleId}:`; }
async function listSaleAttachments(saleId) {

  const synced = Array.isArray(state.db.attachments) ? state.db.attachments.filter(x => String(x.saleId) === String(saleId)) : [];
  const byId = new Map();
  [...local, ...synced].forEach(x => byId.set(String(x.id), x));

async function migrateLegacySaleAttachments() {
  try {
    const legacy = await saleAttachRequest("readonly");
    if (!legacy?.length) return;
    state.db.attachments = Array.isArray(state.db.attachments) ? state.db.attachments : [];
    const known = new Set(state.db.attachments.map(x => String(x.id)));
    let changed = false;
    for (const item of legacy) {
      if (known.has(String(item.id)) || !item.blob) continue;
      const dataUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result || "")); reader.onerror = () => reject(reader.error); reader.readAsDataURL(item.blob); });
      state.db.attachments.push({ id: item.id, saleId: String(item.saleId), name: item.name, type: item.type || "application/octet-stream", size: item.size, createdAt: item.createdAt || Date.now(), dataUrl });
      known.add(String(item.id)); changed = true;
    }
    if (changed) saveDB();
  } catch (err) { console.warn("Não foi possível migrar anexos antigos:", err); }
}
function formatFileSize(bytes) {
  const n = Number(bytes || 0);
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  if (n < 1024 * 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
  return `${(n / 1024 / 1024 / 1024).toFixed(2)} GB`;
}
async function handleSaleAttachments(input, saleId) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  try {
    state.db.attachments = Array.isArray(state.db.attachments) ? state.db.attachments : [];
    for (const file of files) {
      const id = `${saleId}:${Date.now()}:${Math.random().toString(36).slice(2)}`;
      const dataUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result || "")); reader.onerror = () => reject(reader.error || new Error("Falha ao ler arquivo")); reader.readAsDataURL(file); });
      const record = { id, saleId: String(saleId), name: file.name, type: file.type || "application/octet-stream", size: file.size, createdAt: Date.now(), dataUrl };
      // Cópia local rápida e cópia no banco sincronizado entre dispositivos.
      await saleAttachRequest("readwrite", { ...record, blob: file });
      state.db.attachments.push(record);
    }
    saveDB();
    toast(`${files.length} anexo(s) adicionado(s) ao pedido.`);
    input.value = "";
    openSaleAttachments(saleId);
  } catch (err) {
    console.error(err);
    toast("Não foi possível armazenar o anexo. O navegador pode ter atingido o limite de armazenamento disponível.", "error");
  }
}
async function viewSaleAttachment(attachmentId) {

  const win = window.open("about:blank", "_blank");
  try {
    const syncedItem = (state.db.attachments || []).find(x => String(x.id) === String(attachmentId));
    const item = syncedItem || await saleAttachRequest("readonly", attachmentId);
    if (!item?.blob && !item?.dataUrl) { if (win) win.close(); return toast("Anexo não encontrado.", "error"); }
    // Blob URL faz o Chrome abrir PDF no visualizador nativo, inclusive para cópia sincronizada.
    const blob = item.dataUrl ? dataUrlToBlob(item.dataUrl) : item.blob;
    if (!blob) throw new Error("Conteúdo do anexo inválido");
    const url = URL.createObjectURL(blob);
    if (win && !win.closed) {
      win.location.href = url;
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } else {
      const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
  } catch (err) { if (win && !win.closed) win.close(); console.error(err); toast("Não foi possível abrir o anexo no navegador.", "error"); }

async function downloadSaleAttachment(attachmentId) {

    const a = document.createElement("a");

async function deleteSaleAttachment(attachmentId, saleId) {
  const localItem = await saleAttachRequest("readonly", attachmentId);
  const syncedItem = (state.db.attachments || []).find(x => String(x.id) === String(attachmentId));
  const item = localItem || syncedItem;
  if (!item) return toast("Anexo não encontrado.", "error");
  if (!confirm(`Excluir o anexo "${item.name}"?`)) return;
  try {

    state.db.attachments = (state.db.attachments || []).filter(x => String(x.id) !== String(attachmentId));

function savePurchaseEdit(event, id) {
event.preventDefault();
const p = byId("purchases", id);
if (!p) return;
const data = Object.fromEntries(new FormData(event.target).entries());
const newProduct = byId("products", data.productId);
if (!newProduct) return toast("Selecione um produto.", "error");

const newQty = Math.max(1, num(data.qty));
const newUnitCost = num(data.unitCost);
const newIsOrcamento = paymentMethodKey(data.method) === "orcamento";
const newRule = paymentMethodDef(data.method);
const newIsParcelado = !newIsOrcamento && paymentAllowsInstallments(data.method);
// Reverte somente o estoque que o status antigo realmente movimentou e aplica a nova regra.
if (oldProduct && statusDef(p.status).affectsStock) oldProduct.stock = Number(oldProduct.stock || 0) - oldQty;
const newStatus = newIsOrcamento ? "orcamento" : newIsParcelado ? (purchaseInstallments(p).length && purchaseInstallments(p).every(i => i.status === "pago") ? "pago" : "crediario") : (newRule.affectsCash ? "pago" : "pendente");
if (newProduct && statusDef(newStatus).affectsStock) newProduct.stock = Number(newProduct.stock || 0) + newQty;
if (newUnitCost > 0) newProduct.cost = newUnitCost;
p.supplierId = data.supplierId;
p.date = data.date;
p.productId = data.productId;
p.qty = newQty;
p.unitCost = newUnitCost;
p.total = newQty * newUnitCost;
p.status = newStatus;
p.method = normalizePaymentMethodName(data.method);
p.dueDate = data.dueDate;
p.notes = (data.notes || "").trim();
if (newIsParcelado) {
  const draftItems = state.purchaseEditId === id && state.purchaseCred?.items?.length ? state.purchaseCred.items : [];
  const oldItems = draftItems.length ? draftItems : purchaseInstallments(p);
  const count = Math.max(1, oldItems.length || paymentInstallmentCount(data.method));
  p.crediario = Array.from({length: count}, (_, idx) => ({
    ...(oldItems[idx] || {}), num: idx + 1,
    dueDate: oldItems[idx]?.dueDate || addInterval(p.dueDate || today(), "meses", idx),
    amount: oldItems[idx]?.amount != null ? Number(oldItems[idx].amount) : 0,
    status: oldItems[idx]?.status === "pago" ? "pago" : "pendente"
  }));
  const totalEditado = Number(p.total || 0), per = Math.round((totalEditado / count) * 100) / 100;
  let acc = 0;
  p.crediario.forEach((inst, idx) => { if (oldItems[idx]?.amount == null || !oldItems[idx]) inst.amount = idx === count - 1 ? Math.round((totalEditado - acc) * 100) / 100 : per; acc += per; });
  p.dueDate = p.crediario[0]?.dueDate || p.dueDate;
  syncPurchaseCash(p);
} else {
  delete p.crediario;
  state.db.cash = state.db.cash.filter(m => !((m.refType === "compra" && m.refId === p.id) || String(m.refId || "").startsWith(`parcelaCompra:${p.id}:`)));
  if (statusDef(p.status).affectsCash || paymentMethodDef(p.method).affectsCash) applyPurchasePayment(p, false);
}
 saveDB();
 state.purchaseEditId = null;
 state.purchaseForm = null;
 state.purchaseCred = null;
 closeModal();
 render();
 toast("Compra atualizada.");
}

function crediarioParcelas() {
const lista = [];
(state.db.sales || []).filter(s => Array.isArray(s.crediario) && paymentAllowsInstallments(s.method)).forEach(sale => {

paidDate: inst.paidDate || "",

pago,

dias,

function compraParcelas() {

// Desfaz a baixa de uma parcela (caso tenha baixado por engano)
function desfazerParcelaCaixa(saleId, idx) {
const sale = byId("sales", saleId);
if (!sale || !sale.crediario) return;
const inst = sale.crediario[idx];
if (!inst || inst.status !== "pago") return;
if (!confirm(`Desfazer a baixa da parcela ${inst.num}? O lançamento será removido do caixa.`)) return;
const parcelaRef = `parcela:${sale.id}:${idx}`;
const alvo = `parc ${inst.num}/${sale.crediario.length}`;
const pos = (state.db.cash || []).findIndex(m =>
  (m.refType === "crediario" && String(m.refId || "") === parcelaRef) ||
  (m.refType === "venda" && m.refId === sale.id && m.category === "Crediário" && String(m.description || "").includes(alvo))
);
if (pos >= 0) state.db.cash.splice(pos, 1);
if (inst.stockDeducted) reverseIptvInstallmentStock(sale, idx);
inst.status = "pendente";
// Ao reabrir uma parcela, o pedido volta a aparecer como Crediário.
sincronizarPedidoPelasParcelas(sale);
if (!(sale.crediario || []).some(x => x.status === "pago")) reversePaidSaleStock(sale);
delete inst.paidDate;
delete inst.paidMethod;
delete inst.paidNotes;
saveDB();
render();
toast(`Parcela ${inst.num} voltou para pendente.`);
}

// Descobre pedido/código de barras/cliente/itens de um lançamento do caixa
function cashRowMeta(m) {
const meta = { order: "", barcode: "", whoName: "", whoSub: "", whoColor: "", itemsHtml: "", origem: "MANUAL", refSale: null, refPurchase: null, purchaseProductName: "" };

const montarItensVenda = (s) => {
  const grupos = new Map();
  (s?.items || []).forEach(i => {
    const nome = i.name || "Produto";
    const chave = stripAccents(nome);
    if (!grupos.has(chave)) grupos.set(chave, { name: nome, qty: 0, gift: isGiftItem(i) });
    grupos.get(chave).qty += Math.max(1, Number(i.qty || 1));
  });
  return Array.from(grupos.values()).map(g =>
    `${escapeHtml(g.name)} <span class="muted">(${g.qty}×)</span>${g.gift ? ` <span class="pill gold" style="font-size:9px">BRINDE</span>` : ""}`
  ).join("<br>");
};

const preencherVenda = (s) => {
  if (!s) return;
  meta.refSale = s;
  meta.order = s.orderNumber || "";
  meta.barcode = s.barcode || "";
  const c = byId("clients", s.clientId);
  if (c) {
    meta.whoName = c.name || "";
    meta.whoSub = c.phone || "";
    meta.whoColor = c.color || "#22d3ee";
  }
};

if (m.refType === "venda_pendente") {
  meta.origem = "VENDA";
  const s = byId("sales", m.refId);
  preencherVenda(s);
  if (s) meta.itemsHtml = montarItensVenda(s);

} else if (m.refType === "crediario_pendente" || m.refType === "crediario" ||
           (m.category === "Crediário" && m.refType === "venda")) {
    meta.origem = "CREDIÁRIO";
  let s = null;
  let idx = Number.isInteger(Number(m.installmentIndex)) ? Number(m.installmentIndex) : null;

  // Formato novo: parcela:SALE_ID:INDEX
  const ref = String(m.refId || "");
  const mm = ref.match(/^parcela:(.+):(\d+)$/);
  if (mm) {
    s = byId("sales", mm[1]);
    if (idx === null) idx = Number(mm[2]);
  } else {
    // Formato antigo: refId era o próprio sale.id.
    s = byId("sales", m.refId);
  }

  // Compatibilidade com lançamentos antigos que só tinham a descrição.
  if (idx === null && s && Array.isArray(s.crediario)) {
    const dm = String(m.description || "").match(/\bparc(?:ela)?\s+(\d+)\s*\/\s*(\d+)/i);
    if (dm) idx = Math.max(0, Number(dm[1]) - 1);
  }

    preencherVenda(s);
  const crediarioReal = !!(s && (s.status === "crediario" || (Array.isArray(s.crediario) && s.crediario.length)));
  if (!crediarioReal && s) {
    meta.origem = statusName(s.status || "faturado");
    meta.itemsHtml = montarItensVenda(s) || escapeHtml(m.description || meta.origem);
  }
  if (crediarioReal && s && Array.isArray(s.crediario) && idx !== null) {
    const inst = s.crediario[idx];
    if (inst) {
      const parcela = `Parcela ${inst.num || idx + 1}/${s.crediario.length}`;
      const produtos = montarItensVenda(s);
      meta.itemsHtml = produtos ? `${parcela}<br><span class="muted">Produto: </span>${produtos}` : parcela;
    }
  }

  // Se ainda não conseguiu localizar a parcela, mantém pelo menos a descrição.
  if (!meta.itemsHtml) meta.itemsHtml = escapeHtml(m.description || "Crediário");

} else if (m.refType === "venda" || m.refType === "brinde" || m.refType === "bonus") {
  meta.origem = m.refType === "brinde" ? "BRINDE" : (m.refType === "bonus" ? "BÔNUS" : "VENDA");
  const s = byId("sales", m.refId);
  preencherVenda(s);
  if (s) {
    const base = m.refType === "brinde" ? giftItemsOf(s) : (m.refType === "bonus" ? (s.items || []).filter(isPlanItem) : (s.items || []));
    const grupos = new Map();
    base.forEach(i => {
      const nome = i.name || "Produto";
      const chave = stripAccents(nome);
      if (!grupos.has(chave)) grupos.set(chave, { name: nome, qty: 0, gift: isGiftItem(i) });
      grupos.get(chave).qty += Math.max(1, Number(i.qty || 1));
    });
    meta.itemsHtml = Array.from(grupos.values()).map(g =>
      `${escapeHtml(g.name)} <span class="muted">(${g.qty}×)</span>${g.gift ? ` <span class="pill gold" style="font-size:9px">BRINDE</span>` : ""}`
    ).join("<br>");
  }

		} else if (m.refType === "compra" || m.refType === "compra_pendente" || m.refType === "compra_crediario" || m.refType === "compra_crediario_pendente") {
		  meta.origem = "COMPRA";
		  const rawRef = String(m.refId || "");
		  const refMatch = rawRef.match(/^parcelaCompra:(.+):(\d+)$/);
		  const p = byId("purchases", refMatch ? refMatch[1] : m.refId);
	  if (p) {
	    meta.refPurchase = p;
	    meta.order = p.orderNumber || "";
	    const supplier = byId("suppliers", p.supplierId);
	    if (supplier) {
	      meta.whoName = supplier.name || "";
	      meta.whoSub = supplier.phone || "";
	    } else {
	      meta.whoName = p.supplierName || p.supplier || "";
	    }
	    const product = byId("products", p.productId);
	    if (product) {
	      meta.barcode = product.barcode || p.barcode || "";
	      meta.purchaseProductName = product.name || "";
	    } else {
	      meta.barcode = p.barcode || "";
	      meta.purchaseProductName = "Produto";
	    }
		    const instIdx = Number.isInteger(Number(m.installmentIndex)) ? Number(m.installmentIndex) : (refMatch ? Number(refMatch[2]) : null);
		    if (instIdx !== null && purchaseInstallments(p)[instIdx]) {
		      const inst = purchaseInstallments(p)[instIdx];
		      meta.itemsHtml = `Parcela ${inst.num || instIdx + 1}/${purchaseInstallments(p).length}<br><span class="muted">Produto: </span>${escapeHtml(meta.purchaseProductName || "Produto")}`;
		    } else {
	        const grupos = new Map();
		      if (p.items && p.items.length) {
		      p.items.forEach(i => {
	        const nome = i.name || "Produto";
	        const chave = stripAccents(nome);
	        if (!grupos.has(chave)) grupos.set(chave, { name: nome, qty: 0 });
	        grupos.get(chave).qty += Math.max(1, Number(i.qty || 1));
	      });
	    } else if (product) {
	      const nome = product.name || "Produto";
	      const chave = stripAccents(nome);
	      grupos.set(chave, { name: nome, qty: Math.max(1, Number(p.qty || 1)) });
	    } else {
	      grupos.set("produto", { name: "Compra de produto", qty: Math.max(1, Number(p.qty || 1)) });
	    }
		    meta.itemsHtml = Array.from(grupos.values()).map(g =>
		      `${escapeHtml(g.name)} <span class="muted">(${g.qty}×)</span>`
		    ).join("<br>");
	        }
		  }

} else if (m.refType === "manual") {
  const c = byId("clients", m.clientId);
  if (c) {
    meta.whoName = c.name || "";
    meta.whoSub = c.phone || "";
    meta.whoColor = c.color || "#22d3ee";
  }

} else if (m.refType === "produto") {
  meta.origem = "PRODUTO";
  const p = byId("products", m.refId);
  if (p) {
    meta.purchaseProductName = p.name || "";
    meta.itemsHtml = `${escapeHtml(p.name || "—")} <span class="muted">(${Math.max(1, Number(m.qty || 1))}×)</span>`;
  }
}

if (!meta.itemsHtml) meta.itemsHtml = escapeHtml(m.description || m.category || "—");
return meta;
}

// === EDITAR PAGAMENTO PELO CAIXA ===
// Abre uma janela específica para alterar somente a situação financeira do pedido:
// Pendente, Pago ou Crediário. O cadastro/itens do pedido continuam intactos.
function pagamentoAba(v) {
  const el = document.querySelector('#modal-root [name="pagStatus"]');
  if (!el) return;
  el.value = v;
  atualizarEditorPagamento();
}

function alternarStatusParcelaEditor(saleId, idx) {
  // O botão do editor passa o ID como texto; compare os IDs como String
  // para funcionar tanto com IDs numéricos quanto com IDs de texto.
  const sale = (state.db.sales || []).find(s => String(s.id) === String(saleId));
  const i = Number(idx);

  if (!sale || !Array.isArray(sale.crediario) || !sale.crediario[i]) {
    return toast('Parcela não encontrada.', 'error');
  }

  const inst = sale.crediario[i];
  const vaiPagar = inst.status !== 'pago';
  const client = byId('clients', sale.clientId);

  if (vaiPagar) {
    inst.status = 'pago';
    inst.paidDate = inst.paidDate || today();
    inst.paidMethod = inst.paidMethod || sale.method || 'Pix';
    inst.paidNotes = inst.paidNotes || '';
    if (saleAffectsStock(sale)) {
      applyPaidSaleStock(sale);
      applyIptvInstallmentStock(sale, i);
    }
    if (!saleAffectsCash(sale)) {
      saveDB();
      atualizarEditorPagamento();
      if (typeof renderCash === 'function' && state.view === 'caixa') { try { renderCash(); } catch (_) {} }
      toast(`Parcela ${inst.num} marcada como paga.`);
      return;
    }

    const ref = `parcela:${sale.id}:${i}`;
    const existe = (state.db.cash || []).some(m =>
      m.refType === 'crediario' && String(m.refId || '') === ref
    );

    if (!existe) {
      state.db.cash.push({
        id: uid('cai'),
        date: inst.paidDate,
        paidDate: inst.paidDate,
        type: 'entrada',
        category: 'Crediário',
        description: `Crediário ${formatOrderNumber(sale.orderNumber || '')} parc ${inst.num}/${sale.crediario.length}${client ? ' - ' + client.name : ''}${sale.notes ? ' — Obs.: ' + sale.notes : ''}${inst.paidNotes ? ' (' + inst.paidNotes + ')' : ''}`,
        amount: Number(inst.amount || 0),
        method: inst.paidMethod || 'Pix',
        refType: 'crediario',
        refId: ref,
        installmentIndex: i
      });
    }
  } else {
    inst.status = 'pendente';
    inst.paidDate = '';
    inst.paidMethod = '';
    inst.paidNotes = '';

    const ref = `parcela:${sale.id}:${i}`;
    state.db.cash = (state.db.cash || []).filter(m =>
      !(m.refType === 'crediario' && String(m.refId || '') === ref)
    );
    if (inst.stockDeducted) reverseIptvInstallmentStock(sale, i);
    if (!(sale.crediario || []).some(x => x.status === 'pago')) reversePaidSaleStock(sale);
  }

  // O pagamento da parcela não substitui o status operacional escolhido na venda.
  // O status da parcela fica em inst.status; sale.status continua sendo o status da aba Vendas.

  saveDB();

  // Não chama render() aqui: isso recriava a tela e podia fechar/substituir
  // o modal antes que o clique fosse visualmente aplicado.
  atualizarEditorPagamento();

  // Atualiza a lista do Caixa por trás do modal, sem recriar o modal.
  if (typeof renderCash === 'function' && state.view === 'caixa') {
    try { renderCash(); } catch (_) {}
  }

  toast(
    vaiPagar
      ? `Parcela ${inst.num} marcada como paga.`
      : `Parcela ${inst.num} voltou para pendente.`
  );
}

function atualizarEditorPagamento() {
  const form = document.getElementById('editarPagamentoForm');
  if (!form) return;
  const saleId = form.dataset.saleId;
  const sale = byId('sales', saleId);
  if (!sale) return;
  const statusEl = form.querySelector('[name="pagStatus"]');
  const status = statusEl?.value || sale.status || 'pendente';
  // Reverte as baixas anteriores antes de recalcular o novo status.
  if (sale.stockApplied) reversePaidSaleStock(sale);
  if (sale.physicalStockApplied) reversePhysicalStockOnce(sale);
if (sale.iptvStockApplied) reverseIptvImmediateStockOnce(sale);
  if (status !== 'crediario') {
    (sale.crediario || []).forEach((inst, idx) => { if (inst.stockDeducted) reverseIptvInstallmentStock(sale, idx); });
  }
  const area = document.getElementById('editarPagamentoArea');
  if (!area) return;
  const ativo = (v) => status === v ? 'primary' : '';
  const tabs = `<div class="toolbar no-print" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
    <button type="button" class="small ${ativo('pendente')}" onclick="pagamentoAba('pendente')">⏳ Pendente</button>
    <button type="button" class="small ${ativo('pago')}" onclick="pagamentoAba('pago')">✓ Pago</button>
    <button type="button" class="small ${ativo('crediario')}" onclick="pagamentoAba('crediario')">💳 Crediário</button>
  </div>`;
  let body = '';
  if (status === 'pago') {
    body = `<div class="form-grid">
      <label>Data do pagamento<input name="pagPaidDate" type="date" value="${sale.paidDate || today()}"></label>
      <label>Forma de pagamento<select name="pagMethod">
        ${paymentMethods().map(m => `<option ${String(sale.method || 'Pix') === m ? 'selected' : ''}>${m}</option>`).join('')}
      </select></label>
      <label class="full">Observação do pagamento<input name="pagNotes" value="${escapeHtml(sale.paidNotes || '')}" placeholder="Ex: recebido em mãos, Pix Nubank..."></label>
    </div>`;
  } else if (status === 'pendente') {
    body = `<div class="form-grid">
      <label>Data de vencimento<input name="pagDueDate" type="date" value="${sale.dueDate || today()}"></label>
      <label>Forma prevista<select name="pagMethod">
        ${paymentMethods().map(m => `<option ${String(sale.method || 'Pix') === m ? 'selected' : ''}>${m}</option>`).join('')}
      </select></label>
      <div class="full" style="background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.22);border-radius:10px;padding:10px;font-size:12px">
        O pedido ficará <strong>PENDENTE</strong> e só será considerado atrasado quando este vencimento passar sem pagamento.
      </div>
    </div>`;
  } else {
    const cred = Array.isArray(sale.crediario) ? sale.crediario : [];
    const count = Math.max(1, cred.length || 1);
    const first = cred[0]?.dueDate || sale.dueDate || addInterval(today(), 'meses', 1);
    body = `<div class="form-grid">
      <label>Nº de parcelas<input name="pagCredCount" type="number" min="1" step="1" value="${count}" onchange="atualizarParcelasEditorPagamento()" aria-label="Quantidade de parcelas do crediário"></label>
      <label>1ª parcela<input name="pagCredFirstDate" type="date" value="${first}" onchange="atualizarParcelasEditorPagamento()"></label>
      <div class="full" id="pagCredParcelas">${editorParcelasHTML(sale, count, first)}</div>
      <div class="full" style="background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.25);border-radius:10px;padding:10px;font-size:12px">
        Parcelas já pagas continuam pagas. As demais ficam <strong>PENDENTES</strong> e poderão ser baixadas individualmente no Caixa.
      </div>
    </div>`;
  }
  area.innerHTML = tabs + body;
}
function editorParcelasHTML(sale, count, firstDate) {
  const old = Array.isArray(sale.crediario) ? sale.crediario : [];
  const n = Math.max(1, Number(count || old.length || 2));
  const total = Number(sale.total || 0);
  const per = Math.round((total / n) * 100) / 100;
  let acc = 0;
  const rows = Array.from({length:n}, (_,i) => {
    const o = old[i] || {};
    const amount = o.amount != null ? Number(o.amount || 0) : (i === n-1 ? Math.round((total-acc)*100)/100 : per);
    acc += per;
    const due = o.dueDate || addInterval(firstDate, 'meses', i);
    const st = o.status === 'pago' ? 'pago' : 'pendente';
    return `<tr>
      <td class="mono">${i+1}</td>
      <td><input name="pagCredDue${i}" type="date" value="${due}" style="width:100%;padding:6px 8px"></td>
      <td class="money"><div style="display:flex;align-items:center;justify-content:center;gap:4px;width:100%"><span style="color:#f87171;font-weight:900">R$</span><input name="pagCredAmount${i}" type="text" inputmode="decimal" value="${String(amount.toFixed(2)).replace('.', ',')}" style="width:82px;min-width:0;padding:6px 5px;text-align:center!important;font-weight:800;color:#f87171" aria-label="Valor da parcela ${i+1}"></div></td>
      <td>
        <button type="button"
          class="small ${st === 'pago' ? 'primary' : ''}"
          onclick="alternarStatusParcelaEditor('${sale.id}', ${i})"
          title="Clique para alternar entre Pendente e Pago">
          ${st === 'pago' ? '✓ Pago' : '⏳ Pendente'}
        </button>
      </td>
      <td style="text-align:right">
        ${st === 'pago'
          ? `<span class="muted" style="font-size:11px">${o.paidDate ? fmtDate(o.paidDate) : 'pago'}</span>`
          : `<span class="muted" style="font-size:11px">a receber</span>`}
      </td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Pagamento</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function salvarEdicaoPagamento(event) {
  event.preventDefault();
  const form = event.target;
  const sale = byId('sales', form.dataset.saleId);
  if (!sale) return;
  const status = form.querySelector('[name="pagStatus"]')?.value || 'pendente';
  clearSaleStockEffects(sale);
  limparCaixaDoPagamento(sale.id);
  if (status === 'pendente') {
    definirStatusPagamentoVenda(sale, 'pendente');
    sale.dueDate = form.querySelector('[name="pagDueDate"]')?.value || sale.dueDate || today();
    sale.method = form.querySelector('[name="pagMethod"]')?.value || sale.method || 'Pix';
    delete sale.paidDate;
    delete sale.paidNotes;
    delete sale.crediario;
    syncSaleStockWithPaymentRule(sale);
  } else if (status === 'pago') {
    definirStatusPagamentoVenda(sale, 'pago');
    sale.paidDate = form.querySelector('[name="pagPaidDate"]')?.value || today();
    sale.method = form.querySelector('[name="pagMethod"]')?.value || sale.method || 'Pix';
    sale.paidNotes = String(form.querySelector('[name="pagNotes"]')?.value || '').trim();
    syncSaleStockWithPaymentRule(sale);
    applySalePayment(sale, false);
  } else if (status === 'crediario') {
    const count = Math.max(1, num(form.querySelector('[name="pagCredCount"]')?.value) || (Array.isArray(sale.crediario) ? sale.crediario.length : 1));
    const first = form.querySelector('[name="pagCredFirstDate"]')?.value || sale.dueDate || addInterval(today(), 'meses', 1);
    const old = Array.isArray(sale.crediario) ? sale.crediario : [];
    const total = Number(sale.total || 0);
    const per = Math.round((total / count) * 100) / 100;
    let acc = 0;
    let novoTotal = 0;
    sale.crediario = Array.from({length:count}, (_,i) => {
      const prev = old[i] || {};
      const calculado = i === count-1 ? Math.round((total-acc)*100)/100 : per;
      const campoValor = form.querySelector(`[name="pagCredAmount${i}"]`)?.value;
      const amount = campoValor !== undefined && String(campoValor).trim() !== '' ? Math.max(0, Math.round(num(campoValor) * 100) / 100) : (prev.amount != null ? Number(prev.amount || 0) : calculado);
      novoTotal += amount;
      acc += per;
      const due = form.querySelector(`[name="pagCredDue${i}"]`)?.value || prev.dueDate || addInterval(first, 'meses', i);
      return {
        num: i+1, dueDate: due, amount,
        status: prev.status === 'pago' ? 'pago' : 'pendente',
        paidDate: prev.status === 'pago' ? (prev.paidDate || '') : '',
        paidMethod: prev.status === 'pago' ? (prev.paidMethod || sale.method || 'Pix') : '',
        paidNotes: prev.status === 'pago' ? (prev.paidNotes || '') : ''
      };
    });
    sale.total = Math.round(novoTotal * 100) / 100;
    definirStatusPagamentoVenda(sale, 'crediario');
    sale.dueDate = sale.crediario[0]?.dueDate || first;
    sale.method = form.querySelector('[name="pagMethod"]')?.value || sale.method || 'Pix';
    syncSaleStockWithPaymentRule(sale);
    const client = byId('clients', sale.clientId);
    sale.crediario.forEach((inst, idx) => {
      if (inst.status !== 'pago') return;
      if (!paymentMethodDef(inst.paidMethod || sale.method).affectsCash) return;
      state.db.cash.push({
        id: uid('cai'), date: inst.paidDate || today(), paidDate: inst.paidDate || today(),
        type: 'entrada', category: 'Crediário',
        description: `Crediário ${formatOrderNumber(sale.orderNumber || '')} parc ${inst.num}/${sale.crediario.length}${client ? ' - ' + client.name : ''}${sale.notes ? ' — Obs.: ' + sale.notes : ''}${inst.paidNotes ? ' (' + inst.paidNotes + ')' : ''}`,
        amount: Number(inst.amount || 0), method: inst.paidMethod || sale.method || 'Pix',
        refType: 'crediario', refId: `parcela:${sale.id}:${idx}`
      });
    });
  }
  saveDB();
  closeModal();
  render();
  toast(`Pagamento do pedido ${formatOrderNumber(sale.orderNumber || '')} alterado para ${status === 'pago' ? 'Pago' : status === 'crediario' ? 'Crediário' : 'Pendente'}.`);
}

function renderCash() {
// Tudo fica em uma única movimentação do Caixa: pagos e pendentes juntos.
// Pendências que ainda não geraram lançamento em state.db.cash (vendas e parcelas de crediário)
// entram como linhas virtuais e, ao serem baixadas, passam a existir normalmente no caixa.
const pagos = (state.db.cash || []).map(m => ({
  ...m,
  status: ["pago", "pendente", "cancelado"].includes(String(m.status || "").toLowerCase()) ? String(m.status).toLowerCase() : "pago"
}));

// Compatibilidade: parcelas já marcadas como pagas no pedido aparecem no Caixa
// mesmo quando o lançamento correspondente não foi gravado nas versões anteriores.
const credPagos = [];
(state.db.sales || []).forEach(s => {
  if (s.status !== "crediario" || !Array.isArray(s.crediario)) return;
  s.crediario.forEach((inst, idx) => {
    if (inst.status !== "pago") return;
    const novoRef = `parcela:${s.id}:${idx}`;
    const existe = pagos.some(m =>
      (m.refType === "crediario" && String(m.refId || "") === novoRef) ||
      (m.category === "Crediário" && m.refType === "venda" && m.refId === s.id &&
       String(m.description || "").includes(`parc ${inst.num}/${s.crediario.length}`))
    );
    if (existe) return;
    const client = byId("clients", s.clientId);
    credPagos.push({
      id: `paidcred:${s.id}:${idx}`,
      date: inst.paidDate || s.date || today(),
      paidDate: inst.paidDate || "",
      dueDate: inst.dueDate || "",
      type: "entrada",
      category: "Crediário",
      description: `Crediário ${formatOrderNumber(s.orderNumber || "")} parc ${inst.num}/${s.crediario.length}${client ? " - " + client.name : ""}`,
      amount: Number(inst.amount || 0),
      method: inst.paidMethod || s.method || "Pix",
      status: "pago",
      refType: "crediario",
      refId: novoRef,
      installmentIndex: idx
    });
  });
});

const pendCred = crediarioParcelas().filter(p => !p.pago).map(p => ({
  id: `pendcred:${p.saleId}:${p.idx}`,
  date: p.dueDate || today(),
  dueDate: p.dueDate || "",
  paidDate: "",
  type: "entrada",
  category: "Crediário",
  description: `Crediário ${formatOrderNumber(p.orderNumber || "")} parc ${p.num}/${p.totalParcelas}`,
  amount: p.valor,
  method: p.metodo || "Pix",
  status: "pendente",
  refType: "crediario_pendente",
  refId: p.saleId,
  installmentIndex: p.idx
}));
// Vendas parceladas já são representadas por suas parcelas; não criar também
// uma linha extra com o valor total da venda.
const pendVendas = (state.db.sales || []).filter(s => s.status !== "orcamento" && !(Array.isArray(s.crediario) && s.crediario.length) && statusPagamentoVenda(s) === "pendente").map(s => ({
  id: `pendsale:${s.id}`,
  date: s.dueDate || s.date || today(),
  dueDate: s.dueDate || s.date || "",
  type: "entrada",
  category: "Venda pendente",
  description: `Pedido ${formatOrderNumber(s.orderNumber || "")}`,
  amount: Number(s.total || 0),
  method: s.method || "Pix",
  status: "pendente",
  refType: "venda_pendente",
  refId: s.id
}));
// Compras pendentes também aparecem no histórico unificado como saídas previstas.
const pendCompras = [];
(state.db.purchases || []).filter(p => !["pago", "cancelado", "orcamento"].includes(p.status)).forEach(p => {
  const parcelas = purchaseInstallments(p);
  if (parcelas.length) {
    parcelas.forEach((inst, idx) => {
      if (inst.status === "pago" || inst.status === "cancelado") return;
      pendCompras.push({id:`pendcompra:${p.id}:${idx}`, date:inst.dueDate || p.dueDate || p.date || today(), dueDate:inst.dueDate || p.dueDate || "", type:"saida", category:"Compra / Crediário", description:`Compra ${formatOrderNumber(p.orderNumber || "")} parc ${inst.num}/${parcelas.length}`, amount:Number(inst.amount || 0), method:p.method || "Pix", status:"pendente", refType:"compra_crediario_pendente", refId:purchaseInstallmentRef(p.id, idx), installmentIndex:idx});
    });
  } else {
    pendCompras.push({id:`pendcompra:${p.id}`, date:p.dueDate || p.date || today(), dueDate:p.dueDate || p.date || "", type:"saida", category:"Compra pendente", description:"Compra pendente", amount:Number(p.total || 0), method:p.method || "Pix", status:"pendente", refType:"compra_pendente", refId:p.id});
  }
});
// Orçamentos ficam fora do Caixa: não são movimentação financeira e não entram no histórico.
const todos = [...pagos, ...credPagos, ...pendCred, ...pendVendas, ...pendCompras].sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
state.cashPrintMoves = todos;
// Filtros: data inicial/final, cliente (ou fornecedor), nº do pedido e status
let moves = applyFilters("caixa", todos, {
date: m => m.date,
client: m => cashRowMeta(m).whoName,
order: m => cashRowMeta(m).order,
status: m => cashStatus(m),
type: m => m.type,
  gift: m => {
    const sale = m.refType === "venda" || m.refType === "venda_pendente" || m.refType === "crediario" || m.refType === "crediario_pendente" ? byId("sales", saleIdFromCashMove(m)) : null;
    return !!(sale && (sale.items || []).some(isGiftItem));
  }
});
// A coluna Data controla a ordem do Caixa.
const dateDirection = (state.cashDateSort || "desc") === "asc" ? 1 : -1;
const caixaFiltroAtual = getFilters("caixa");
moves.sort((a, b) => {
  const saleA = saleIdFromCashMove(a), saleB = saleIdFromCashMove(b);
  // Ao pesquisar cliente/pedido, parcelas do mesmo pedido ficam 1, 2, 3...,
  // independentemente da data de pagamento de cada uma.
  if ((caixaFiltroAtual.client || caixaFiltroAtual.order) && saleA && saleA === saleB) {
    const idxA = Number.isFinite(Number(a.installmentIndex)) ? Number(a.installmentIndex) : 999999;
    const idxB = Number.isFinite(Number(b.installmentIndex)) ? Number(b.installmentIndex) : 999999;
    if (idxA !== idxB) return idxA - idxB;
  }
  const dateCompare = String(a.date || "").localeCompare(String(b.date || ""));
  if (dateCompare) return dateCompare * dateDirection;
  const orderA = Number(cashRowMeta(a).order || 0);
  const orderB = Number(cashRowMeta(b).order || 0);
  return orderB - orderA;
});
const filtrado = filtersActive("caixa");
const paidMoves = moves.filter(m => (m.status || "pago") === "pago");
const balance = paidMoves.reduce((s, m) => s + (m.type === "entrada" ? Number(m.amount || 0) : -Number(m.amount || 0)), 0);
const income = paidMoves.filter(m => m.type === "entrada").reduce((s, m) => s + Number(m.amount || 0), 0);
const expense = paidMoves.filter(m => m.type === "saida").reduce((s, m) => s + Number(m.amount || 0), 0);
const pendingCount = moves.filter(m => m.status === "pendente").length;
return `
<section class="card" style="margin-bottom:14px">
<div class="section-title">
<div><h3>Movimentações</h3><p>${filtrado ? `${moves.length} de ${todos.length} lançamento(s) — filtro ativo` : "Histórico no padrão dos pedidos"}</p></div>
<div class="section-title-right no-print" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
<button type="button" class="small info" onclick="irParaVendas()" title="Voltar para a aba Vendas">← Vendas</button>
<button type="button" class="ghost small" onclick="clearFilters('caixa')" ${filtrado ? "" : `disabled style="opacity:0.45"`}>↺ Limpar filtros</button>
</div>
</div>
${filterBar("caixa", [{v:"pago", t:"Pago"}, {v:"pendente", t:"Pendente"}, {v:"cancelado", t:"Cancelado"}], "Cliente / Fornecedor", "Nº do pedido")}
</section>
<div class="grid grid-3">
${metricCard(filtrado ? "Saldo do período" : "Saldo atual", money(balance), `${moves.length} movimento(s)${filtrado ? ` de ${todos.length}` : ""}${pendingCount ? ` · ${pendingCount} pendente(s)` : ""}`, "cash", "green")}
${metricCard("Entradas totais", money(income), filtrado ? "Entradas filtradas" : "Todas as entradas", "trend", "green")}
${metricCard("Saídas totais", money(expense), filtrado ? "Saídas filtradas" : "Todas as saídas", "trend", "warn")}
</div>
${cashSectionsHTML(moves, balance, income, expense, filtrado, todos.length)}`;
}

function saveInstallmentEditor(event) {
  event.preventDefault();
  const edit = state.installmentEdit;
  const list = edit?.kind === "cash" ? state.cashCred?.items : state.crediario?.items;
  const item = list?.[edit?.index];
  if (!item) return closeModal();
  const data = Object.fromEntries(new FormData(event.currentTarget || event.target).entries());
  const amount = num(data.amount);
  if (amount < 0) return toast("Informe um valor válido.", "error");
  item.dueDate = data.dueDate || item.dueDate || today();
  item.amount = Math.round(amount * 100) / 100;
  item.status = data.status === "pago" ? "pago" : (data.status === "cancelado" ? "cancelado" : "pendente");
  if (item.status === "pago") item.paidDate = item.paidDate || today(); else { delete item.paidDate; delete item.paidMethod; }
  state.installmentEdit = null;
  closeModal();
  if (edit.kind === "cash") renderCashForm(); else render();
  toast("Parcela atualizada.");
}

function saveCash(event) {

const methods = paymentMethods();
const method = methods.includes(String(data.method || "")) ? String(data.method) : (methods[0] || "Pix");
const clientId = String(data.clientId || state.cashForm?.clientId || "").trim();
if (amount <= 0) return toast("Informe um valor maior que zero.", "error");
if (paymentAllowsInstallments(method)) {
captureCashForm();
ensureCashCred(paymentInstallmentCount(method));
recalcCashCredAmounts();
const c = state.cashCred;
if (!c || !c.items.length) return toast("Configure as parcelas da forma de pagamento.", "error");

category: category || method,
description: `${description} — parc ${it.num}/${c.items.length}`,

});
});
state.cashForm = null;
state.cashCred = null;
saveDB();
closeModal();
render();
toast(`${method} lançado em ${c.items.length} parcela(s) pendente(s).`);
return;
}
state.db.cash.push({ id: uid("cai"), date, type, category, description, amount, method, refType: "manual", refId: "", clientId, status: "pago" });
state.cashForm = null;
state.cashCred = null;
saveDB();
closeModal();
render();
toast("Movimento lançado.");
}

  if (oldStock && !newStock) reversePaidSaleStock(sale);

  if (sale.status === "crediario") {

  } else if (oldPhysical) {
    reversePhysicalStockOnce(sale);
  }
  const oldCash = !!oldRule.affectsCash;
  const newCash = !!newRule.affectsCash;
  if (oldCash === newCash) return;
  state.db.cash = (state.db.cash || []).filter(m => !(
    ((m.refType === "venda" || m.refType === "venda_pendente") && String(m.refId || "") === String(sale.id)) ||
    ((m.refType === "crediario" || m.refType === "crediario_pendente") && String(m.refId || "").startsWith(`parcela:${sale.id}:`))

reader.onload = () => {
const img = new Image();
img.onload = () => {
const maxW = 500, maxH = 220;
const scale = Math.min(1, maxW / img.width, maxH / img.height);
const canvas = document.createElement("canvas");
canvas.width = Math.max(1, Math.round(img.width * scale));
canvas.height = Math.max(1, Math.round(img.height * scale));
const ctx = canvas.getContext("2d");
ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
state.db.settings.companyLogo = canvas.toDataURL("image/jpeg", 0.78);
render();
toast("Logotipo carregado e reduzido. Clique em Salvar cadastro da empresa.");
};
img.onerror = () => toast("Não foi possível ler o logotipo.", "error");
img.src = String(reader.result || "");
};
reader.readAsDataURL(file);
